<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#111;
  font-family:Arial,sans-serif;
}


/* ======================================== */
/* REPRODUCTOR */
/* ======================================== */

.jvaudio{
  width:800px;
  max-width:90vw;

  padding:20px;

  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:12px;

  background:white;

  border-radius:18px;

  box-shadow:
    0 20px 60px rgba(0,0,0,0.5);

  overflow:hidden;
}

.jvaudio audio{
  display:none;
}


/* ======================================== */
/* SUBTÍTULOS */
/* ======================================== */

.subtitulos{
  flex:0 0 100%;
  width:100%;

  min-height:32px;

  text-align:center;

  font-size:18px;
  font-weight:bold;
  line-height:1.4;

  color:#222;

  padding:4px 20px 8px 20px;
}


/* ======================================== */
/* BOTONES */
/* ======================================== */

.jvaudio button{
  flex:0 0 44px;

  width:44px;
  height:44px;

  border:none;
  border-radius:50%;

  background:#111;
  color:white;

  font-size:17px;

  cursor:pointer;

  display:flex;
  justify-content:center;
  align-items:center;

  transition:
    transform 0.2s,
    background 0.2s,
    color 0.2s;
}

.jvaudio button:hover{
  transform:scale(1.08);
  background:#333;
}

.jvaudio button:active{
  transform:scale(0.95);
}


/* ======================================== */
/* BOTÓN CC */
/* ======================================== */

.jvaudio .boton-subtitulos{
  font-size:12px;
  font-weight:bold;
}

.jvaudio .boton-subtitulos.activo{
  background:#ddd;
  color:#111;
}


/* ======================================== */
/* TIEMPO */
/* ======================================== */

.tiempo{
  flex:0 0 42px;

  width:42px;

  font-size:12px;

  color:#777;

  text-align:center;
}


/* ======================================== */
/* WAVEFORM */
/* ======================================== */

.waveform{
  flex:1 1 0;

  min-width:0;

  width:0;
  height:80px;

  display:block;

  cursor:pointer;
}


/* ======================================== */
/* VOLUMEN */
/* ======================================== */

.volumen{
  flex:0 0 80px;

  width:80px;

  appearance:none;
  -webkit-appearance:none;

  height:4px;

  background:#ddd;

  border-radius:10px;

  cursor:pointer;

  outline:none;
}

.volumen::-webkit-slider-thumb{
  appearance:none;
  -webkit-appearance:none;

  width:13px;
  height:13px;

  border-radius:50%;

  background:#111;

  cursor:pointer;
}

.volumen::-moz-range-thumb{
  width:13px;
  height:13px;

  border:none;
  border-radius:50%;

  background:#111;

  cursor:pointer;
}


/* ======================================== */
/* RESPONSIVE */
/* ======================================== */

@media(max-width:600px){

  .jvaudio{
    gap:7px;
    padding:12px;
  }

  .jvaudio button{
    flex-basis:36px;
    width:36px;
    height:36px;
  }

  .volumen{
    flex-basis:50px;
    width:50px;
  }

  .tiempo{
    flex-basis:35px;
    width:35px;
    font-size:10px;
  }

  .subtitulos{
    font-size:15px;
  }

}

</style>
</head>

<body>


<audio src="letyougo.mp3"></audio>


<script>


// ========================================
// CONVERTIR TIEMPO VTT A SEGUNDOS
// ========================================

function tiempoASegundos(tiempo){

  let partes = tiempo.split(":")


  // MM:SS.mmm

  if(partes.length == 2){

    let minutos = parseInt(partes[0])
    let segundos = parseFloat(partes[1])

    return minutos * 60 + segundos

  }


  // HH:MM:SS.mmm

  if(partes.length == 3){

    let horas = parseInt(partes[0])
    let minutos = parseInt(partes[1])
    let segundos = parseFloat(partes[2])

    return (
      horas * 3600 +
      minutos * 60 +
      segundos
    )

  }


  return 0

}



// ========================================
// TODOS LOS AUDIOS
// ========================================

let audios = document.querySelectorAll("audio")


audios.forEach(function(audio){


  // ========================================
  // CONTENEDOR
  // ========================================

  let contenedor = document.createElement("div")

  contenedor.classList.add("jvaudio")

  audio.parentNode.insertBefore(
    contenedor,
    audio
  )

  contenedor.appendChild(audio)



  // ========================================
  // SUBTÍTULOS
  // ========================================

  let contenedorSubtitulos =
    document.createElement("div")

  contenedorSubtitulos.classList.add(
    "subtitulos"
  )

  contenedor.appendChild(
    contenedorSubtitulos
  )



  // ========================================
  // ATRÁS
  // ========================================

  let atras = document.createElement("button")

  atras.textContent = "↶"
  atras.title = "Retroceder 5 segundos"

  contenedor.appendChild(atras)



  // ========================================
  // PLAY
  // ========================================

  let reproducir = document.createElement("button")

  reproducir.textContent = "▶"
  reproducir.title = "Reproducir"

  contenedor.appendChild(reproducir)



  // ========================================
  // ADELANTE
  // ========================================

  let adelante = document.createElement("button")

  adelante.textContent = "↷"
  adelante.title = "Avanzar 5 segundos"

  contenedor.appendChild(adelante)



  // ========================================
  // SUBTÍTULOS CC
  // ========================================

  let botonSubtitulos =
    document.createElement("button")

  botonSubtitulos.textContent = "CC"

  botonSubtitulos.title =
    "Activar subtítulos"

  botonSubtitulos.classList.add(
    "boton-subtitulos"
  )

  contenedor.appendChild(
    botonSubtitulos
  )



  // ========================================
  // TIEMPO
  // ========================================

  let tiempo = document.createElement("div")

  tiempo.classList.add("tiempo")

  tiempo.textContent = "0:00"

  contenedor.appendChild(tiempo)



  // ========================================
  // CANVAS
  // ========================================

  let canvas = document.createElement("canvas")

  canvas.height = 80

  canvas.classList.add("waveform")

  contenedor.appendChild(canvas)

  let ctx = canvas.getContext("2d")



  // ========================================
  // VOLUMEN
  // ========================================

  let volumen = document.createElement("input")

  volumen.type = "range"

  volumen.min = 0
  volumen.max = 1
  volumen.step = 0.01
  volumen.value = 1

  volumen.classList.add("volumen")

  contenedor.appendChild(volumen)



  // ========================================
  // CONFIGURACIÓN
  // ========================================

  let numeroBarras = 90

  let canales = []

  let esEstereo = false

  let subtitulosActivos = false

  let transcripcion = []

  let subtitulosDisponibles = false



  // ========================================
  // OBTENER NOMBRE DEL VTT
  // ========================================

  let origenAudio =
    audio.getAttribute("src")


  let nombreAudio =
    origenAudio.substring(
      0,
      origenAudio.lastIndexOf(".")
    )


  let nombreTranscripcion =
    nombreAudio + ".vtt"


  console.log(
    "Buscando subtítulos:",
    nombreTranscripcion
  )



  // ========================================
  // CARGAR VTT
  // ========================================

  fetch(nombreTranscripcion)

  .then(function(resultado){

    if(!resultado.ok){

      throw new Error(
        "No existe el archivo VTT"
      )

    }

    return resultado.text()

  })

  .then(function(datos){

    datos =
      datos.replace(/\r/g, "")


    datos =
      datos.replace(
        /^WEBVTT.*\n/,
        ""
      )


    let partido =
      datos.split(/\n\n+/)


    partido.forEach(function(pieza){

      let lineas =
        pieza.trim().split("\n")


      if(lineas.length < 2){
        return
      }


      let lineaTiempo = -1


      lineas.forEach(
        function(linea,indice){

          if(linea.includes("-->")){
            lineaTiempo = indice
          }

        }
      )


      if(lineaTiempo == -1){
        return
      }


      let tiempos =
        lineas[lineaTiempo]
        .split(/\s+-->\s+/)


      if(tiempos.length != 2){
        return
      }


      let inicio =
        tiempos[0].trim()


      let final =
        tiempos[1].trim()


      final =
        final.split(" ")[0]


      let texto =
        lineas
        .slice(lineaTiempo + 1)
        .join(" ")


      transcripcion.push({

        inicio:inicio,

        final:final,

        texto:texto

      })

    })


    subtitulosDisponibles = true


    console.log(
      "Subtítulos cargados:",
      transcripcion
    )

  })

  .catch(function(error){

    console.log(
      "No se pudieron cargar subtítulos:",
      nombreTranscripcion
    )


    // Si no hay VTT, ocultamos CC

    botonSubtitulos.style.display =
      "none"

    contenedorSubtitulos.style.display =
      "none"

  })



  // ========================================
  // BOTÓN SUBTÍTULOS
  // ========================================

  botonSubtitulos.onclick = function(){

    if(!subtitulosDisponibles){
      return
    }


    subtitulosActivos =
      !subtitulosActivos


    if(subtitulosActivos){

      botonSubtitulos.classList.add(
        "activo"
      )

      botonSubtitulos.title =
        "Desactivar subtítulos"

      actualizarSubtitulos()

    }else{

      botonSubtitulos.classList.remove(
        "activo"
      )

      botonSubtitulos.title =
        "Activar subtítulos"

      contenedorSubtitulos.textContent =
        ""

    }

  }



  // ========================================
  // ACTUALIZAR SUBTÍTULOS
  // ========================================

  function actualizarSubtitulos(){

    if(!subtitulosActivos){

      contenedorSubtitulos.textContent =
        ""

      return

    }


    let textoActual = ""


    for(
      let i = 0;
      i < transcripcion.length;
      i++
    ){

      let frase =
        transcripcion[i]


      let inicio =
        tiempoASegundos(
          frase.inicio
        )


      let final =
        tiempoASegundos(
          frase.final
        )


      if(
        audio.currentTime >= inicio
        &&
        audio.currentTime <= final
      ){

        textoActual =
          frase.texto

        break

      }

    }


    contenedorSubtitulos.textContent =
      textoActual

  }



  // ========================================
  // CARGAR AUDIO / WAVEFORM
  // ========================================

  fetch(audio.src)

    .then(function(respuesta){

      return respuesta.arrayBuffer()

    })

    .then(function(datos){

      let contextoAudio =
        new AudioContext()


      contextoAudio.decodeAudioData(

        datos,

        function(buffer){

          esEstereo =
            buffer.numberOfChannels === 2


          let numeroCanales =
            esEstereo ? 2 : 1


          for(
            let canal = 0;
            canal < numeroCanales;
            canal++
          ){

            let samples =
              buffer.getChannelData(canal)


            canales.push(
              calcularWaveform(samples)
            )

          }


          dibujar()

        }

      )

    })



  // ========================================
  // CALCULAR WAVEFORM
  // ========================================

  function calcularWaveform(samples){

    let alturas = []


    let salto =
      Math.floor(
        samples.length /
        numeroBarras
      )


    for(
      let barra = 0;
      barra < numeroBarras;
      barra++
    ){

      let maximo = 0


      let inicio =
        barra * salto


      let final =
        Math.min(
          inicio + salto,
          samples.length
        )


      let subSalto =
        Math.max(
          1,
          Math.floor(salto / 100)
        )


      for(
        let i = inicio;
        i < final;
        i += subSalto
      ){

        let valor =
          Math.abs(samples[i])


        if(valor > maximo){

          maximo = valor

        }

      }


      alturas.push(maximo)

    }


    return alturas

  }



  // ========================================
  // DIBUJAR
  // ========================================

  function dibujar(){

    if(canales.length === 0){
      return
    }


    let anchoReal =
      Math.floor(canvas.clientWidth)


    if(anchoReal <= 0){
      return
    }


    if(canvas.width !== anchoReal){

      canvas.width = anchoReal

    }


    let ancho = canvas.width
    let alto = canvas.height


    ctx.clearRect(
      0,
      0,
      ancho,
      alto
    )


    let progreso = 0


    if(
      audio.duration &&
      !isNaN(audio.duration)
    ){

      progreso =
        audio.currentTime /
        audio.duration

    }


    let separacion = 3


    let anchoBarra =
      (
        ancho -
        separacion *
        (numeroBarras - 1)
      )
      /
      numeroBarras


    if(anchoBarra < 1){

      separacion = 1


      anchoBarra =
        (
          ancho -
          separacion *
          (numeroBarras - 1)
        )
        /
        numeroBarras

    }


    let barraActual =
      progreso *
      (numeroBarras - 1)


    if(!esEstereo){

      dibujarMono(
        canales[0],
        anchoBarra,
        separacion,
        barraActual
      )

    }else{

      dibujarEstereo(
        canales[0],
        canales[1],
        anchoBarra,
        separacion,
        barraActual
      )

    }

  }



  // ========================================
  // MONO
  // ========================================

  function dibujarMono(
    alturas,
    anchoBarra,
    separacion,
    barraActual
  ){

    let alto = canvas.height

    let medio =
      alto / 2


    for(
      let i = 0;
      i < alturas.length;
      i++
    ){

      let altura =
        alturas[i] *
        medio *
        0.85


      altura =
        Math.max(
          altura,
          3
        )


      let x =
        i *
        (
          anchoBarra +
          separacion
        )


      ctx.fillStyle =
        obtenerColor(
          i,
          barraActual
        )


      ctx.beginPath()


      ctx.roundRect(

        x,

        medio - altura,

        Math.max(
          1,
          anchoBarra
        ),

        altura * 2,

        Math.max(
          1,
          anchoBarra
        ) / 2

      )


      ctx.fill()

    }

  }



  // ========================================
  // ESTÉREO
  // ========================================

  function dibujarEstereo(
    izquierdo,
    derecho,
    anchoBarra,
    separacion,
    barraActual
  ){

    let alto =
      canvas.height


    let separacionCentral = 4


    let alturaCanal =
      (
        alto -
        separacionCentral
      ) / 2


    let centroSuperior =
      alturaCanal / 2


    let centroInferior =
      alturaCanal +
      separacionCentral +
      alturaCanal / 2


    dibujarCanal(

      izquierdo,

      centroSuperior,

      alturaCanal,

      anchoBarra,

      separacion,

      barraActual

    )


    dibujarCanal(

      derecho,

      centroInferior,

      alturaCanal,

      anchoBarra,

      separacion,

      barraActual

    )

  }



  // ========================================
  // DIBUJAR CANAL
  // ========================================

  function dibujarCanal(
    alturas,
    centro,
    alturaDisponible,
    anchoBarra,
    separacion,
    barraActual
  ){

    for(
      let i = 0;
      i < alturas.length;
      i++
    ){

      let altura =
        alturas[i] *
        alturaDisponible *
        0.40


      altura =
        Math.max(
          altura,
          2
        )


      let x =
        i *
        (
          anchoBarra +
          separacion
        )


      ctx.fillStyle =
        obtenerColor(
          i,
          barraActual
        )


      ctx.beginPath()


      ctx.roundRect(

        x,

        centro - altura,

        Math.max(
          1,
          anchoBarra
        ),

        altura * 2,

        Math.max(
          1,
          anchoBarra
        ) / 2

      )


      ctx.fill()

    }

  }



  // ========================================
  // COLOR
  // ========================================

  function obtenerColor(
    barra,
    barraActual
  ){

    let gris = 204


    if(barra > barraActual){

      return "rgb(" +
        gris + "," +
        gris + "," +
        gris + ")"

    }


    let distancia =
      barraActual -
      barra


    let distanciaDegradado = 35


    let intensidad =
      1 -
      (
        distancia /
        distanciaDegradado
      )


    intensidad =
      Math.max(
        0,
        Math.min(
          1,
          intensidad
        )
      )


    let color =
      Math.round(
        gris *
        (1 - intensidad)
      )


    return "rgb(" +
      color + "," +
      color + "," +
      color + ")"

  }



  // ========================================
  // PLAY / PAUSE
  // ========================================

  reproducir.onclick = function(){

    if(audio.paused){

      audio.play()

    }else{

      audio.pause()

    }

  }


  audio.onplay = function(){

    reproducir.textContent = "❚❚"

  }


  audio.onpause = function(){

    reproducir.textContent = "▶"

  }


  audio.onended = function(){

    reproducir.textContent = "▶"

  }



  // ========================================
  // ADELANTE
  // ========================================

  adelante.onclick = function(){

    if(!audio.duration){
      return
    }


    audio.currentTime =
      Math.min(
        audio.currentTime + 5,
        audio.duration
      )

  }



  // ========================================
  // ATRÁS
  // ========================================

  atras.onclick = function(){

    audio.currentTime =
      Math.max(
        audio.currentTime - 5,
        0
      )

  }



  // ========================================
  // VOLUMEN
  // ========================================

  volumen.oninput = function(){

    audio.volume =
      this.value

  }



  // ========================================
  // ACTUALIZAR
  // ========================================

  audio.ontimeupdate = function(){

    dibujar()


    tiempo.textContent =
      formatearTiempo(
        audio.currentTime
      )


    actualizarSubtitulos()

  }



  // ========================================
  // CLICK EN WAVEFORM
  // ========================================

  canvas.onclick = function(evento){

    cambiarPosicion(evento)

  }



  // ========================================
  // ARRASTRAR
  // ========================================

  let arrastrando = false


  canvas.onmousedown = function(evento){

    arrastrando = true

    cambiarPosicion(evento)

  }


  window.addEventListener(
    "mousemove",
    function(evento){

      if(arrastrando){

        cambiarPosicion(evento)

      }

    }
  )


  window.addEventListener(
    "mouseup",
    function(){

      arrastrando = false

    }
  )



  // ========================================
  // CAMBIAR POSICIÓN
  // ========================================

  function cambiarPosicion(evento){

    if(
      !audio.duration ||
      isNaN(audio.duration)
    ){
      return
    }


    let rect =
      canvas.getBoundingClientRect()


    let x =
      evento.clientX -
      rect.left


    x =
      Math.max(
        0,
        Math.min(
          x,
          rect.width
        )
      )


    let porcentaje =
      x /
      rect.width


    audio.currentTime =
      porcentaje *
      audio.duration


    dibujar()

    actualizarSubtitulos()

  }



  // ========================================
  // FORMATEAR TIEMPO
  // ========================================

  function formatearTiempo(segundos){

    if(isNaN(segundos)){

      return "0:00"

    }


    let minutos =
      Math.floor(
        segundos / 60
      )


    let resto =
      Math.floor(
        segundos % 60
      )


    if(resto < 10){

      resto =
        "0" + resto

    }


    return minutos + ":" + resto

  }



  // ========================================
  // REDIMENSIONAR
  // ========================================

  window.addEventListener(
    "resize",
    function(){

      dibujar()

    }
  )

})

</script>

</body>
</html>
