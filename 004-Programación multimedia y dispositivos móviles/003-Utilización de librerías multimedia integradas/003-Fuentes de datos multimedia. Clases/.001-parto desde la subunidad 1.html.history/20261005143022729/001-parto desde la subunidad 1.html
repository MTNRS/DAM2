<!doctype html>
<html>
<head>
  <meta charset="UTF-8">

  <style>
    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#111;
      font-family:Arial,sans-serif;
    }

    /* REPRODUCTOR */
    .jvvideo{
      position:relative;
      display:inline-block;
      overflow:hidden;
      border-radius:14px;
      background:black;
      box-shadow:0 20px 60px rgba(0,0,0,0.5);
    }

    .jvvideo video{
      display:block;
      width:800px;
      max-width:100%;
    }


    /* ========================= */
    /* CONTROLES */
    /* ========================= */

    .controles{
      position:absolute;
      left:0;
      right:0;
      bottom:0;

      display:flex;
      align-items:center;
      gap:8px;

      padding:35px 14px 12px 14px;

      background:
        linear-gradient(
          transparent,
          rgba(0,0,0,0.85)
        );

      opacity:0;
      transform:translateY(15px);

      transition:
        opacity 0.3s ease,
        transform 0.3s ease;

      pointer-events:none;
    }


    /* MOSTRAR AL PASAR EL RATÓN */

    .jvvideo:hover .controles{
      opacity:1;
      transform:translateY(0);
      pointer-events:auto;
    }


    /* ========================= */
    /* BOTONES */
    /* ========================= */

    .controles button{
      width:38px;
      height:38px;

      border:none;
      border-radius:50%;

      background:rgba(255,255,255,0.12);
      color:white;

      font-size:17px;

      cursor:pointer;

      display:flex;
      justify-content:center;
      align-items:center;

      backdrop-filter:blur(10px);

      transition:
        background 0.2s,
        transform 0.2s;
    }

    .controles button:hover{
      background:rgba(255,255,255,0.28);
      transform:scale(1.1);
    }

    .controles button:active{
      transform:scale(0.95);
    }


    /* ========================= */
    /* SLIDERS */
    /* ========================= */

    .controles input[type="range"]{
      appearance:none;
      height:4px;

      background:rgba(255,255,255,0.3);

      border-radius:10px;

      cursor:pointer;

      outline:none;
    }

    .controles input[type="range"]::-webkit-slider-thumb{
      appearance:none;

      width:13px;
      height:13px;

      border-radius:50%;

      background:white;

      box-shadow:0 0 5px rgba(0,0,0,0.5);
    }


    /* VOLUMEN */

    .volumen{
      width:80px;
    }


    /* PROGRESO */

    .progreso{
      flex:1;
    }

  </style>
</head>

<body>

<video src="002-utilizacion-de-formularios-desde-codigo-2026-10-05_13-44-07.webm"></video>


<script>

let videos = document.querySelectorAll("video")

videos.forEach(function(video){

  // =========================
  // CONTENEDOR
  // =========================

  let contenedor = document.createElement("div")
  contenedor.classList.add("jvvideo")

  video.parentNode.insertBefore(contenedor,video)

  contenedor.appendChild(video)


  // =========================
  // CONTROLES
  // =========================

  let controles = document.createElement("div")
  controles.classList.add("controles")

  contenedor.appendChild(controles)


  // ATRÁS

  let atras = document.createElement("button")
  atras.textContent = "↶"
  atras.title = "Retroceder"

  controles.appendChild(atras)


  // PLAY

  let reproducir = document.createElement("button")
  reproducir.textContent = "▶"
  reproducir.title = "Reproducir"

  controles.appendChild(reproducir)


  // ADELANTE

  let adelante = document.createElement("button")
  adelante.textContent = "↷"
  adelante.title = "Avanzar"

  controles.appendChild(adelante)


  // PROGRESO

  let progreso = document.createElement("input")

  progreso.type = "range"
  progreso.min = 0
  progreso.max = 1
  progreso.step = 0.001
  progreso.value = 0

  progreso.classList.add("progreso")

  controles.appendChild(progreso)


  // VOLUMEN

  let volumen = document.createElement("input")

  volumen.type = "range"
  volumen.min = 0
  volumen.max = 1
  volumen.step = 0.01
  volumen.value = 1

  volumen.classList.add("volumen")

  controles.appendChild(volumen)


  // =========================
  // EVENTOS
  // =========================

  reproducir.onclick = function(){

    if(video.paused){

      video.play()

      reproducir.textContent = "❚❚"

    }else{

      video.pause()

      reproducir.textContent = "▶"

    }

  }


  adelante.onclick = function(){

    video.currentTime += 5

  }


  atras.onclick = function(){

    video.currentTime -= 5

  }


  volumen.oninput = function(){

    video.volume = this.value

  }


  video.ontimeupdate = function(){

    if(video.duration){

      progreso.value =
        video.currentTime / video.duration

    }

  }


  progreso.oninput = function(){

    video.currentTime =
      this.value * video.duration

  }


  // CLICK EN EL VIDEO = PLAY / PAUSE

  video.onclick = function(){

    if(video.paused){

      video.play()

      reproducir.textContent = "❚❚"

    }else{

      video.pause()

      reproducir.textContent = "▶"

    }

  }

})

</script>

</body>
</html>
