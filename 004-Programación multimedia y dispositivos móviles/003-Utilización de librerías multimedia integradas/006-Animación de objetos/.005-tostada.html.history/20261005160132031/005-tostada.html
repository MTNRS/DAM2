<!doctype html>
<html lang="es">
	<head>
	<meta charset="UTF-8">
    <style>
      #contenedor{
        width:50px;
      	height:50px;
      	background:red;
        animation:muevemueve 10s;
        position:relative;
      }
      @keyframes muevemueve{
        0%{left:0px;top:0px;background:red;transform:rotate(0deg);}
        25%{left:100px;top:0px;background:green;transform:rotate(270deg);}
        50%{left:100px;top:100px;background:blue;transform:rotate(100deg);}
        75%{left:0px;top:100px;background:orange;transform:rotate(360deg);}
        100%{left:0px;top:0px;background:red;transform:rotate(0deg);}
      }
    </style>
  </head>
  <body>
    <div id="contenedor"></div>
    
	</body>
</html>
