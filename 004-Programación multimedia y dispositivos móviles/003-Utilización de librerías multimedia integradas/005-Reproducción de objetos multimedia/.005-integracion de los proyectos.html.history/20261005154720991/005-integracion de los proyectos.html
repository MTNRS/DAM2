<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#111;
  font-family:Arial,sans-serif;
}


/* ======================================================== */
/* REPRODUCTOR                                               */
/* ======================================================== */

.jvvideo{
  position:relative;
  display:inline-block;
  overflow:hidden;
  border-radius:14px;
  background:black;
  box-shadow:0 20px 60px rgba(0,0,0,0.5);
}


/* El vídeo sigue existiendo pero no se muestra */

.jvvideo video{
  display:none;
}


/* El canvas es ahora la pantalla */

.jvvideo canvas{
  display:block;
  width:800px;
  max-width:100%;
  cursor:pointer;
}


/* ======================================================== */
/* SUBTÍTULOS                                                */
/* ======================================================== */

.subtitulos{
  position:absolute;

  left:50%;
  bottom:80px;

  transform:translateX(-50%);

  width:85%;

  text-align:center;

  color:white;
  font-size:22px;
  font-weight:bold;
  line-height:1.4;

  text-shadow:
    2px 2px 3px black,
    -2px -2px 3px black,
    2px -2px 3px black,
    -2px 2px 3px black;

  pointer-events:none;

  z-index:10;
}


/* ======================================================== */
/* CONTROLES                                                 */
/* ======================================================== */

.controles{
  position:absolute;

  left:0;
  right:0;
  bottom:0;

  display:flex;
  align-items:center;
  gap:8px;

  padding:35px 14px 12px 14px;

  background:
    linear-gradient(
      transparent,
      rgba(0,0,0,0.85)
    );

  opacity:0;

  transform:translateY(15px);

  transition:
    opacity 0.3s ease,
    transform 0.3s ease;

  pointer-events:none;

  z-index:20;
}


.jvvideo:hover .controles{
  opacity:1;
  transform:translateY(0);
  pointer-events:auto;
}


/* ======================================================== */
/* BOTONES                                                   */
/* ======================================================== */

.controles button{
  width:38px;
  height:38px;

  flex-shrink:0;

  border:none;
  border-radius:50%;

  background:rgba(255,255,255,0.12);
  color:white;

  font-size:15px;

  cursor:pointer;

  display:flex;
  justify-content:center;
  align-items:center;

  backdrop-filter:blur(10px);

  transition:
    background 0.2s,
    color 0.2s,
    transform 0.2s;
}


.controles button:hover{
  background:rgba(255,255,255,0.28);
  transform:scale(1.1);
}


.controles button:active{
  transform:scale(0.95);
}


.controles button.activo{
  background:white;
  color:black;
}


.boton-subtitulos{
  font-size:12px !important;
  font-weight:bold;
}


.boton-efectos{
  font-size:11px !important;
  font-weight:bold;
}


/* ======================================================== */
/* SLIDERS                                                   */
/* ======================================================== */

.controles input[type="range"]{
  appearance:none;

  height:4px;

  background:rgba(255,255,255,0.3);

  border-radius:10px;

  cursor:pointer;
  outline:none;
}


.controles input[type="range"]::-webkit-slider-thumb{
  appearance:none;

  width:13px;
  height:13px;

  border-radius:50%;

  background:white;

  box-shadow:0 0 5px rgba(0,0,0,0.5);
}


.progreso{
  flex:1;
}


.volumen{
  width:80px;
}


/* ======================================================== */
/* PANEL DE EFECTOS                                          */
/* ======================================================== */

.panel-efectos{

  position:absolute;

  top:15px;
  right:15px;

  width:300px;
  max-height:calc(100% - 100px);

  overflow-y:auto;

  padding:18px;

  background:rgba(10,10,10,0.88);

  backdrop-filter:blur(15px);

  border:1px solid rgba(255,255,255,0.15);

  border-radius:12px;

  color:white;

  z-index:30;

  display:none;

  box-shadow:0 10px 40px rgba(0,0,0,0.5);
}


.panel-efectos.visible{
  display:block;
}


.panel-efectos h3{
  margin:0 0 15px 0;
  font-size:16px;
}


.panel-efectos h4{
  margin:20px 0 10px 0;

  padding-bottom:5px;

  border-bottom:
    1px solid rgba(255,255,255,0.15);

  font-size:12px;

  text-transform:uppercase;

  color:#aaa;
}


.control-efecto{
  margin-bottom:12px;
}


.control-efecto label{
  display:flex;
  justify-content:space-between;

  margin-bottom:5px;

  font-size:12px;
}


.control-efecto input[type="range"]{
  width:100%;
}


.efecto-check{

  display:flex;
  align-items:center;
  gap:8px;

  margin:8px 0;

  font-size:13px;

  cursor:pointer;
}


.botones-efecto{

  display:grid;

  grid-template-columns:
    repeat(2,1fr);

  gap:6px;
}


.botones-efecto button{

  padding:8px;

  border:0;

  border-radius:6px;

  background:#333;
  color:white;

  cursor:pointer;
}


.botones-efecto button.activo{
  background:white;
  color:black;
}


.reset-efectos{

  width:100%;

  margin-top:15px;

  padding:10px;

  border:0;

  border-radius:6px;

  background:#555;
  color:white;

  cursor:pointer;
}


.reset-efectos:hover{
  background:#777;
}

</style>
</head>

<script>


// ========================================================
// CONVERTIR TIEMPO VTT A SEGUNDOS
// ========================================================

function tiempoASegundos(tiempo){

  let partes = tiempo.split(":");


  if(partes.length == 2){

    let minutos =
      parseInt(partes[0]);

    let segundos =
      parseFloat(partes[1]);

    return
      minutos * 60 +
      segundos;

  }


  if(partes.length == 3){

    let horas =
      parseInt(partes[0]);

    let minutos =
      parseInt(partes[1]);

    let segundos =
      parseFloat(partes[2]);

    return (
      horas * 3600 +
      minutos * 60 +
      segundos
    );

  }


  return 0;

}



// ========================================================

let videos =

  // ======================================================

  // ======================================================

  // ======================================================

  // ======================================================

  let volumen =
    document.createElement("input");


  volumen.type = "range";

  volumen.min = 0;
  volumen.max = 1;
  volumen.step = 0.01;
  volumen.value = 1;


  volumen.classList.add("volumen");


  controles.appendChild(volumen);



  // ======================================================
  // PANEL EFECTOS
  // ======================================================

  let panelEfectos =
    document.createElement("div");


  panelEfectos.classList.add(
    "panel-efectos"
  );


  panelEfectos.innerHTML = `

    <h3>Efectos de vídeo</h3>


    <h4>Ajustes</h4>


    <div class="control-efecto">

      <label>
        <span>Brillo</span>
        <span class="valor-brillo">0</span>
      </label>

      <input
        type="range"

    </div>


    <div class="control-efecto">

      <label>
        <span>Contraste</span>
        <span class="valor-contraste">0</span>
      </label>

        type="range"
        class="fx-contraste"
        min="-100"

    </div>


    <div class="control-efecto">

      <label>
        <span>Saturación</span>
        <span class="valor-saturacion">100%</span>
      </label>

      <input
        type="range"
        class="fx-saturacion"
        min="0"
        max="200"
        value="100">

    </div>


    <div class="control-efecto">

      <label>
        <span>Gamma</span>
        <span class="valor-gamma">1.00</span>
      </label>

      <input
        type="range"
        class="fx-gamma"
        min="10"
        max="300"
        value="100">

    </div>



    <h4>Color</h4>


    <label class="efecto-check">
      <input
        type="checkbox"
        class="fx-gris">
      Escala de grises
    </label>


    <label class="efecto-check">
      <input
        type="checkbox"
        class="fx-negativo">
      Negativo
    </label>


    <label class="efecto-check">
      <input
        type="checkbox"
        class="fx-sepia">
      Sepia
    </label>



    <h4>Canales RGB</h4>


    <label class="efecto-check">

      <input
        type="checkbox"
        class="fx-rojo"
        checked>

      Canal rojo

    </label>


    <label class="efecto-check">

      <input
        type="checkbox"
        class="fx-verde"
        checked>

      Canal verde

    </label>


    <label class="efecto-check">

      <input
        type="checkbox"
        class="fx-azul"
        checked>

      Canal azul

    </label>



    <h4>Umbral</h4>


    <label class="efecto-check">

      <input
        type="checkbox"
        class="fx-umbral">

      Activar umbral

    </label>


    <div class="control-efecto">

      <label>
        <span>Umbral</span>
        <span class="valor-umbral">128</span>
      </label>

      <input
        type="range"
        class="fx-valor-umbral"
        min="0"
        max="255"
        value="128">

    </div>



    <h4>Posterización</h4>


    <label class="efecto-check">

      <input

    </label>


    <div class="control-efecto">

      </label>

      <input

    </div>



    <h4>Pixelado</h4>


    <label class="efecto-check">

      <input
        type="checkbox"

    </label>


    <div class="control-efecto">

      </label>

      <input
        type="range"
        class="fx-tamano-pixel"
        min="2"
        max="50"
        value="8">

    </div>



    <h4>Convoluciones</h4>


    <div class="botones-efecto">

      <button
        class="fx-convolucion"

        Normal

      <button
        class="fx-convolucion"
        data-efecto="blur">

      <button

        Sharpen

      <button

        data-efecto="bordes">
        Bordes
      </button>

    </div>


    <button class="reset-efectos">
      Restablecer efectos
    </button>

  `;


  contenedor.appendChild(
    panelEfectos
  );



  // ======================================================
  // REFERENCIAS EFECTOS
  // ======================================================

  let fxBrillo =
    panelEfectos.querySelector(
      ".fx-brillo"
    );


  let fxContraste =
    panelEfectos.querySelector(
      ".fx-contraste"
    );


  let fxSaturacion =
    panelEfectos.querySelector(
      ".fx-saturacion"
    );


  let fxGamma =
    panelEfectos.querySelector(
      ".fx-gamma"
    );


  let fxGris =
    panelEfectos.querySelector(
      ".fx-gris"
    );


  let fxNegativo =
    panelEfectos.querySelector(
      ".fx-negativo"
    );


  let fxSepia =
    panelEfectos.querySelector(
      ".fx-sepia"
    );


  let fxRojo =
    panelEfectos.querySelector(
      ".fx-rojo"
    );


  let fxVerde =
    panelEfectos.querySelector(
      ".fx-verde"
    );


  let fxAzul =
    panelEfectos.querySelector(
      ".fx-azul"
    );


  let fxUmbral =
    panelEfectos.querySelector(
      ".fx-umbral"
    );


  let fxValorUmbral =
    panelEfectos.querySelector(
      ".fx-valor-umbral"
    );


  let fxPosterizar =
    panelEfectos.querySelector(
      ".fx-posterizar"
    );


  let fxNiveles =
    panelEfectos.querySelector(
      ".fx-niveles"
    );


  let fxPixelado =
    panelEfectos.querySelector(
      ".fx-pixelado"
    );


  let fxTamanoPixel =

      ".fx-tamano-pixel"
    );


  let resetEfectos =
    panelEfectos.querySelector(
      ".reset-efectos"
    );



  // ======================================================
  // VALORES VISIBLES
  // ======================================================

  fxBrillo.oninput = function(){

    panelEfectos.querySelector(
      ".valor-brillo"
    ).textContent =
      this.value;

  };


  fxContraste.oninput = function(){

    panelEfectos.querySelector(
      ".valor-contraste"
    ).textContent =
      this.value;

  };


  fxSaturacion.oninput = function(){

    panelEfectos.querySelector(
      ".valor-saturacion"
    ).textContent =

  };


  fxGamma.oninput = function(){

    panelEfectos.querySelector(
      ".valor-gamma"
    ).textContent =
      (this.value / 100)
      .toFixed(2);

  };


  fxValorUmbral.oninput = function(){

    panelEfectos.querySelector(
      ".valor-umbral"
    ).textContent =
      this.value;

  };


  fxNiveles.oninput = function(){

    panelEfectos.querySelector(
      ".valor-posterizar"
    ).textContent =

  };


  fxTamanoPixel.oninput = function(){

      this.value;

  };



  // ======================================================
  // MOSTRAR / OCULTAR PANEL

  botonEfectos.onclick = function(){

    panelEfectos.classList.toggle(
      "visible"
    );


    botonEfectos.classList.toggle(
      "activo"
    );

  };



  // ======================================================
  // CONVOLUCIÓN ACTUAL
  // ======================================================

  let convolucionActual =
    "ninguno";


  let botonesConvolucion =
    panelEfectos.querySelectorAll(
      ".fx-convolucion"
    );


  botonesConvolucion.forEach(
    function(boton){

      boton.onclick =
      function(){

        convolucionActual =
          this.dataset.efecto;


        botonesConvolucion.forEach(
          function(b){

            b.classList.remove(
              "activo"
            );

          }
        );


        this.classList.add(
          "activo"
        );

      };

    }
  );



  // ======================================================
  // RESET
  // ======================================================

  resetEfectos.onclick =
  function(){


    fxBrillo.value = 0;

    fxContraste.value = 0;

    fxSaturacion.value = 100;

    fxGamma.value = 100;


    fxGris.checked = false;

    fxNegativo.checked = false;

    fxSepia.checked = false;


    fxRojo.checked = true;

    fxVerde.checked = true;

    fxAzul.checked = true;


    fxUmbral.checked = false;

    fxValorUmbral.value = 128;


    fxPosterizar.checked = false;

    fxNiveles.value = 4;


    fxPixelado.checked = false;

    fxTamanoPixel.value = 8;


    convolucionActual =
      "ninguno";


    botonesConvolucion.forEach(
      function(boton){

        boton.classList.remove(
          "activo"
        );

      }
    );


    panelEfectos.querySelector(
      '[data-efecto="ninguno"]'
    ).classList.add(
      "activo"
    );


    panelEfectos.querySelector(
      ".valor-brillo"
    ).textContent = 0;


    panelEfectos.querySelector(
      ".valor-contraste"
    ).textContent = 0;


    panelEfectos.querySelector(
      ".valor-saturacion"
    ).textContent = "100%";


    panelEfectos.querySelector(
      ".valor-gamma"
    ).textContent = "1.00";


    panelEfectos.querySelector(
      ".valor-umbral"
    ).textContent = 128;


    panelEfectos.querySelector(
      ".valor-posterizar"
    ).textContent = 4;


    panelEfectos.querySelector(
      ".valor-pixelado"
    ).textContent = 8;

  };


  panelEfectos.querySelector(
    '[data-efecto="ninguno"]'
  ).classList.add(
    "activo"
  );



  // ======================================================
  // SUBTÍTULOS
  // ======================================================

  let subtitulosActivos = false;

  let transcripcion = [];



  // ======================================================
  // NOMBRE VTT
  // ======================================================

  let origenvideo =
    video.getAttribute("src");


  let nombrevideo =
    origenvideo.substring(
      0,
      origenvideo.lastIndexOf(".")
    );


  let nombretranscripcion =
    nombrevideo + ".vtt";



  // ======================================================
  // CARGAR VTT
  // ======================================================

  fetch(nombretranscripcion)

  .then(function(resultado){

    if(!resultado.ok){

      throw new Error(
        "No existe el archivo VTT"
      );

    }

    return resultado.text();

  })

  .then(function(datos){


    datos =
      datos.replace(/\r/g,"");


    datos =
      datos.replace(
        /^WEBVTT.*\n/,
        ""
      );


    let partido =
      datos.split(/\n\n+/);


    partido.forEach(
      function(pieza){


        let lineas =
          pieza.trim().split("\n");


        if(lineas.length < 2){

          return;

        }


        let lineaTiempo = -1;


        lineas.forEach(
          function(linea,indice){

            if(
              linea.includes("-->")
            ){

              lineaTiempo =
                indice;

            }

          }
        );


        if(lineaTiempo == -1){

          return;

        }


        let tiempos =
          lineas[lineaTiempo]
          .split(" --> ");


        if(tiempos.length != 2){

          return;

        }


        let inicio =
          tiempos[0].trim();


        let final =
          tiempos[1]
          .trim()
          .split(" ")[0];


        let texto =
          lineas
          .slice(
            lineaTiempo + 1
          )
          .join(" ");


        transcripcion.push({

          inicio:inicio,

          final:final,

          texto:texto

        });


      }
    );


  })

  .catch(function(error){

    console.log(
      "No se pudieron cargar subtítulos:",
      nombretranscripcion
    );

  });



  // ======================================================
  // ACTUALIZAR SUBTÍTULOS
  // ======================================================

  function actualizarSubtitulos(){


    if(!subtitulosActivos){

      contenedor_transcripcion
        .textContent = "";

      return;

    }


    let textoActual = "";


    transcripcion.forEach(
      function(frase){


        let inicio =
          tiempoASegundos(
            frase.inicio
          );


        let final =
          tiempoASegundos(
            frase.final
          );


        if(
          video.currentTime >= inicio
          &&
          video.currentTime <= final
        ){

          textoActual =
            frase.texto;

        }


      }
    );


    contenedor_transcripcion
      .textContent =
      textoActual;

  }



  // ======================================================
  // BOTÓN SUBTÍTULOS
  // ======================================================

  botonSubtitulos.onclick =
  function(){


    subtitulosActivos =
      !subtitulosActivos;


    if(subtitulosActivos){

      botonSubtitulos
        .classList.add(
          "activo"
        );

      actualizarSubtitulos();

    }else{

      botonSubtitulos
        .classList.remove(
          "activo"
        );

      contenedor_transcripcion
        .textContent = "";

    }

  };



  // ======================================================
  // PROCESAMIENTO RGB
  // ======================================================

  function procesarColor(imagen){


    let pixeles =
      imagen.data;


    let brillo =
      parseFloat(
        fxBrillo.value
      );


    let contraste =
      parseFloat(
        fxContraste.value
      );


    let saturacion =
      parseFloat(
        fxSaturacion.value
      ) / 100;


    let gamma =
      parseFloat(
        fxGamma.value
      ) / 100;


    let factorContraste =
      (
        259 *
        (contraste + 255)
      )
      /
      (
        255 *
        (259 - contraste)
      );


    for(
      let i = 0;
      i < pixeles.length;
      i += 4
    ){


      let r = pixeles[i];

      let g = pixeles[i + 1];

      let b = pixeles[i + 2];



      // ------------------------------------------
      // BRILLO
      // ------------------------------------------

      r += brillo;
      g += brillo;
      b += brillo;



      // ------------------------------------------
      // CONTRASTE
      // ------------------------------------------

      r =
        factorContraste *
        (r - 128) +
        128;


      g =
        factorContraste *
        (g - 128) +
        128;


      b =
        factorContraste *
        (b - 128) +
        128;



      // ------------------------------------------
      // SATURACIÓN
      // ------------------------------------------

      let gris =
        r * 0.299 +
        g * 0.587 +
        b * 0.114;


      r =
        gris +
        (r - gris) *
        saturacion;


      g =
        gris +
        (g - gris) *
        saturacion;


      b =
        gris +
        (b - gris) *
        saturacion;



      // ------------------------------------------
      // GAMMA
      // ------------------------------------------

      r =
        Math.max(
          0,
          Math.min(255,r)
        );


      g =
        Math.max(
          0,
          Math.min(255,g)
        );


      b =
        Math.max(
          0,
          Math.min(255,b)
        );


      r =
        255 *
        Math.pow(
          r / 255,
          1 / gamma
        );


      g =
        255 *
        Math.pow(
          g / 255,
          1 / gamma
        );


      b =
        255 *
        Math.pow(
          b / 255,
          1 / gamma
        );



      // ------------------------------------------
      // ESCALA DE GRISES
      // ------------------------------------------

      if(fxGris.checked){

        let gris =
          r * 0.299 +
          g * 0.587 +
          b * 0.114;

        r = gris;
        g = gris;
        b = gris;

      }



      // ------------------------------------------
      // SEPIA
      // ------------------------------------------

      if(fxSepia.checked){

        let nr =
          r * 0.393 +
          g * 0.769 +
          b * 0.189;


        let ng =
          r * 0.349 +
          g * 0.686 +
          b * 0.168;


        let nb =
          r * 0.272 +
          g * 0.534 +
          b * 0.131;


        r = nr;
        g = ng;
        b = nb;

      }



      // ------------------------------------------
      // NEGATIVO
      // ------------------------------------------

      if(fxNegativo.checked){

        r = 255 - r;
        g = 255 - g;
        b = 255 - b;

      }



      // ------------------------------------------
      // UMBRAL
      // ------------------------------------------

      if(fxUmbral.checked){

        let gris =
          r * 0.299 +
          g * 0.587 +
          b * 0.114;


        let valor =
          gris >=
          fxValorUmbral.value
          ?
          255
          :
          0;


        r = valor;
        g = valor;
        b = valor;

      }



      // ------------------------------------------
      // POSTERIZACIÓN
      // ------------------------------------------

      if(fxPosterizar.checked){

        let niveles =
          parseInt(
            fxNiveles.value
          );


        let salto =
          255 /
          (niveles - 1);


        r =
          Math.round(
            r / salto
          ) * salto;


        g =
          Math.round(
            g / salto
          ) * salto;


        b =
          Math.round(
            b / salto
          ) * salto;

      }



      // ------------------------------------------
      // CANALES RGB
      // ------------------------------------------

      if(!fxRojo.checked){
        r = 0;
      }

      if(!fxVerde.checked){
        g = 0;
      }

      if(!fxAzul.checked){
        b = 0;
      }



      // ------------------------------------------
      // GUARDAMOS
      // ------------------------------------------

      pixeles[i] =
        Math.max(
          0,
          Math.min(255,r)
        );


      pixeles[i + 1] =
        Math.max(
          0,
          Math.min(255,g)
        );


      pixeles[i + 2] =
        Math.max(
          0,
          Math.min(255,b)
        );


    }


    return imagen;

  }



  // ======================================================
  // CONVOLUCIONES
  // ======================================================

  function aplicarConvolucion(
    imagen,
    kernel,
    divisor = 1,
    offset = 0
  ){


    let ancho =
      imagen.width;


    let alto =
      imagen.height;


    let origen =
      imagen.data;


    let salida =
      new ImageData(
        ancho,
        alto
      );


    let destino =
      salida.data;


    for(
      let y = 1;
      y < alto - 1;
      y++
    ){


      for(
        let x = 1;
        x < ancho - 1;
        x++
      ){


        let r = 0;
        let g = 0;
        let b = 0;


        for(
          let ky = -1;
          ky <= 1;
          ky++
        ){


          for(
            let kx = -1;
            kx <= 1;
            kx++
          ){


            let indice =
              (
                (y + ky) *
                ancho +
                (x + kx)
              ) * 4;


            let peso =
              kernel[
                (ky + 1) * 3 +
                (kx + 1)
              ];


            r +=
              origen[indice] *
              peso;


            g +=
              origen[indice + 1] *
              peso;


            b +=
              origen[indice + 2] *
              peso;


          }

        }


        let indiceDestino =
          (
            y * ancho +
            x
          ) * 4;


        destino[indiceDestino] =
          r / divisor +
          offset;


        destino[indiceDestino + 1] =
          g / divisor +
          offset;


        destino[indiceDestino + 2] =
          b / divisor +
          offset;


        destino[indiceDestino + 3] =
          255;


      }

    }


    return salida;

  }



  // ======================================================
  // PIXELADO
  // ======================================================

  function aplicarPixelado(){


    let tamano =
      parseInt(
        fxTamanoPixel.value
      );


    contexto.imageSmoothingEnabled =
      false;


    contexto.drawImage(
      lienzo,

      0,
      0,
      lienzo.width,
      lienzo.height,

      0,
      0,
      Math.ceil(
        lienzo.width / tamano
      ),
      Math.ceil(
        lienzo.height / tamano
      )
    );


    contexto.drawImage(
      lienzo,

      0,
      0,
      Math.ceil(
        lienzo.width / tamano
      ),
      Math.ceil(
        lienzo.height / tamano
      ),

      0,
      0,
      lienzo.width,
      lienzo.height
    );


    contexto.imageSmoothingEnabled =
      true;

  }



  // ======================================================
  // DIBUJAR FOTOGRAMA
  // ======================================================

  function dibujarFotograma(){


    if(
      lienzo.width == 0 ||
      lienzo.height == 0
    ){

      return;

    }


    // ------------------------------------------
    // VIDEO -> CANVAS
    // ------------------------------------------

    contexto.drawImage(
      video,
      0,
      0,
      lienzo.width,
      lienzo.height
    );



    // ------------------------------------------
    // OBTENER PÍXELES
    // ------------------------------------------

    let imagen =
      contexto.getImageData(
        0,
        0,
        lienzo.width,
        lienzo.height
      );



    // ------------------------------------------
    // EFECTOS RGB
    // ------------------------------------------

    imagen =
      procesarColor(
        imagen
      );



    // ------------------------------------------
    // CONVOLUCIONES
    // ------------------------------------------

    if(
      convolucionActual ==
      "blur"
    ){

      imagen =
        aplicarConvolucion(
          imagen,

          [
            1,1,1,
            1,1,1,
            1,1,1
          ],

          9
        );

    }



    if(
      convolucionActual ==
      "sharpen"
    ){

      imagen =
        aplicarConvolucion(
          imagen,

          [
             0,-1, 0,
            -1, 5,-1,
             0,-1, 0
          ]
        );

    }



    if(
      convolucionActual ==
      "bordes"
    ){

      imagen =
        aplicarConvolucion(
          imagen,

          [
            -1,-1,-1,
            -1, 8,-1,
            -1,-1,-1
          ]
        );

    }



    // ------------------------------------------
    // PINTAR RESULTADO
    // ------------------------------------------

    contexto.putImageData(
      imagen,
      0,
      0
    );



    // ------------------------------------------
    // PIXELADO
    // ------------------------------------------

    if(fxPixelado.checked){

      aplicarPixelado();

    }

  }



  // ======================================================
  // LOOP DE FOTOGRAMAS
  // ======================================================

  function siguienteFotograma(){


    dibujarFotograma();


    if(
      video.requestVideoFrameCallback
    ){

      video.requestVideoFrameCallback(
        siguienteFotograma
      );

    }else{

      requestAnimationFrame(
        siguienteFotograma
      );

    }

  }



  // ======================================================
  // METADATOS
  // ======================================================

  video.onloadedmetadata =
  function(){


    lienzo.width =
      video.videoWidth;


    lienzo.height =
      video.videoHeight;


    dibujarFotograma();

  };



  // ======================================================
  // PLAY / PAUSE
  // ======================================================

  reproducir.onclick =
  function(){


    if(video.paused){

      video.play();

    }else{

      video.pause();

    }

  };



  // ======================================================
  // CLICK CANVAS
  // ======================================================

  lienzo.onclick =
  function(){


    if(video.paused){

      video.play();

    }else{

      video.pause();

    }

  };



  // ======================================================
  // ADELANTE
  // ======================================================

  adelante.onclick =
  function(){


    video.currentTime =
      Math.min(
        video.currentTime + 5,
        video.duration
      );

  };



  // ======================================================
  // ATRÁS
  // ======================================================

  atras.onclick =
  function(){


    video.currentTime =
      Math.max(
        video.currentTime - 5,
        0
      );

  };



  // ======================================================
  // VOLUMEN
  // ======================================================

  volumen.oninput =
  function(){

    video.volume =
      this.value;

  };



  // ======================================================
  // ACTUALIZACIÓN DEL VÍDEO
  // ======================================================

  video.ontimeupdate =
  function(){


    if(video.duration){

      progreso.value =
        video.currentTime /
        video.duration;

    }


    actualizarSubtitulos();

  };



  // ======================================================
  // SEEK
  // ======================================================

  progreso.oninput =
  function(){


    if(video.duration){

      video.currentTime =
        this.value *
        video.duration;

    }

  };



  // ======================================================
  // PLAY
  // ======================================================

  video.onplay =
  function(){


    reproducir.textContent =
      "❚❚";


    // Iniciamos procesamiento

    if(
      video.requestVideoFrameCallback
    ){

      video.requestVideoFrameCallback(
        siguienteFotograma
      );

    }else{

      requestAnimationFrame(
        siguienteFotograma
      );

    }

  };



  // ======================================================
  // PAUSE
  // ======================================================

  video.onpause =
  function(){


    reproducir.textContent =
      "▶";


    // Renderizamos también al pausar
    // para permitir cambiar efectos

    dibujarFotograma();

  };



  // ======================================================
  // FIN
  // ======================================================

  video.onended =
  function(){

    reproducir.textContent =
      "▶";

  };



  // ======================================================
  // ACTUALIZAR FRAME AL CAMBIAR EFECTOS EN PAUSA
  // ======================================================

  panelEfectos.addEventListener(
    "input",
    function(){

      if(video.paused){

        dibujarFotograma();

      }

    }
  );


  panelEfectos.addEventListener(
    "click",
    function(){

      if(video.paused){

        setTimeout(
          dibujarFotograma,
          0
        );

      }

    }
  );


});


</script>
