    <div id="contenedor">
      
    </div>
    <script>
      let contenedor = document.querySelector("#contenedor")
      let botones = document.querySelectorAll("button")
      document.querySelector("#pantalla1").onclick = function(){
      	fetch("plantillas/pantalla1.html")
        .then(function(resultado){return resultado.text()})
        .then(function(datos){
        	contenedor.innerHTML = datos
        })
      }
      document.querySelector("#pantalla2").onclick = function(){
      	fetch("plantillas/pantalla2.html")
        .then(function(resultado){return resultado.text()})

        })

      document.querySelector("#pantalla3").onclick = function(){
