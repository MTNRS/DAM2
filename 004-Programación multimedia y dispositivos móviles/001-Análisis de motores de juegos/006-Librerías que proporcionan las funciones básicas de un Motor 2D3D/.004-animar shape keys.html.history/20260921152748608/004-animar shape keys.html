<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>GLB - Three.js - Shape Keys</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
    </style>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
        }
    }
    </script>
</head>

<body>

<script type="module">

    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';


    // ============================================================
    // SCENE
    // ============================================================

    const scene = new THREE.Scene();

    scene.background = new THREE.Color(0xeeeeee);


    // ============================================================
    // CAMERA
    // ============================================================

    const camera = new THREE.PerspectiveCamera(
        20,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
    );

    camera.position.set(0, 3.5, 5);


    // ============================================================
    // RENDERER
    // ============================================================

    const renderer = new THREE.WebGLRenderer({
        antialias: true
    });

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderer.setPixelRatio(
        Math.min(window.devicePixelRatio, 2)
    );

    document.body.appendChild(renderer.domElement);


    // ============================================================
    // LIGHT
    // ============================================================

    const light = new THREE.DirectionalLight(
        0xffffff,
        3
    );

    light.position.set(5, 10, 5);

    scene.add(light);


    // Some ambient light
    const ambient = new THREE.AmbientLight(
        0xffffff,
        1
    );

    scene.add(ambient);


    // ============================================================
    // MORPH TARGETS
    // ============================================================

    let morphMeshes = [];


    // ============================================================
    // LOAD GLB
    // ============================================================

    const loader = new GLTFLoader();

    loader.load(

        'avatar.glb',

        function(gltf) {

            scene.add(gltf.scene);


            // Find every mesh containing morph targets
            gltf.scene.traverse(function(object) {

                if (
                    object.isMesh &&
                    object.morphTargetDictionary &&
                    object.morphTargetInfluences
                ) {

                    console.log(
                        "Morph targets:",
                        object.name,
                        object.morphTargetDictionary
                    );

                    morphMeshes.push(object);
                }

            });

        },

        undefined,

        function(error) {

            console.error(
                "Error loading GLB:",
                error
            );

        }

    );


    // ============================================================
    // SET MORPH TARGET
    // ============================================================

    function setMorph(name, value) {

        morphMeshes.forEach(function(mesh) {

            const index =
                mesh.morphTargetDictionary[name];

            if (index !== undefined) {

                mesh.morphTargetInfluences[index] = value;

            }

        });

    }


    // ============================================================
    // BLINK SYSTEM
    // ============================================================

    let blinking = false;

    let blinkStart = 0;

    let nextBlink =
        performance.now() +
        randomBlinkDelay();


    function randomBlinkDelay() {

        // Between 1.5 and 5 seconds
        return 1500 + Math.random() * 3500;

    }


    function updateBlink(now) {

        if (!blinking) {

            if (now >= nextBlink) {

                blinking = true;

                blinkStart = now;

            }

            return;

        }


        const elapsed = now - blinkStart;


        // Blink duration: 200 ms
        const duration = 200;

        const progress =
            elapsed / duration;


        if (progress >= 1) {

            setMorph(
                'ojos',
                0
            );

            blinking = false;

            nextBlink =
                now +
                randomBlinkDelay();

            return;

        }


        // 0 → 1 → 0

        let value;

        if (progress < 0.5) {

            value =
                progress * 2;

        } else {

            value =
                (1 - progress) * 2;

        }


        setMorph(
            'ojos',
            value
        );

    }


    // ============================================================
    // ANIMATION
    // ============================================================

    const clock = new THREE.Clock();


    function animate() {

        requestAnimationFrame(animate);


        const time =
            clock.getElapsedTime();


        // --------------------------------------------------------
        // "a" shape key
        // --------------------------------------------------------
        //
        // Math.sin gives:
        //
        // -1 → +1
        //
        // Convert to:
        //
        // 0 → 1
        //

        const mouth =
            (Math.sin(time * 4) + 1) / 2;


        setMorph(
            'a',
            mouth
        );


        // --------------------------------------------------------
        // Random blinking
        // --------------------------------------------------------

        updateBlink(
            performance.now()
        );


        // --------------------------------------------------------
        // Render
        // --------------------------------------------------------

        renderer.render(
            scene,
            camera
        );

    }


    animate();


    // ============================================================
    // RESIZE
    // ============================================================

    window.addEventListener(
        'resize',
        function() {

            camera.aspect =
                window.innerWidth /
                window.innerHeight;

            camera.updateProjectionMatrix();

            renderer.setSize(
                window.innerWidth,
                window.innerHeight
            );

        }
    );

</script>

</body>
</html>
