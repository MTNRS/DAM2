<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acceso | jocarsa ERP</title><link rel="stylesheet" href="css/estilo.css"><style>body{display:grid;place-items:center;min-height:100vh;background:#f5f5f5;font-family:Ubuntu,sans-serif}form{display:grid;gap:15px;width:min(360px,90vw);padding:30px;background:white;box-shadow:0 10px 40px #0002}input,button{padding:13px;border:1px solid #ccc}button{background:crimson;color:white;cursor:pointer;border:0;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,0 100%)}#error{color:crimson}</style></head><body><form id="login"><h1>jocarsa | erp</h1><label>Usuario<input name="username" required autocomplete="username"></label><label>Contraseña<input type="password" name="password" required autocomplete="current-password"></label><button>Entrar</button><p id="error" role="alert"></p></form><script>document.querySelector('#login').onsubmit=async e=>{e.preventDefault();try{const r=await fetch('../backend/auth.php?action=login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});const j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'Error de acceso');location.href='index.html'}catch(err){document.querySelector('#error').textContent=err.message}}</script></body></html>
