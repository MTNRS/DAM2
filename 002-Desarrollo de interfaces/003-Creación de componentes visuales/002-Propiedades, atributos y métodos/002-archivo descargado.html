<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Jocarsa UI</title>
</head>
<body>
  <form action="procesa.php" method="POST">
    <p><input type="text" name="nombre" placeholder="Nombre"></p>

    <h2>Editor rico</h2>
    <jocarsa-texto name="mensaje"><p>Hola <b>mundo</b></p></jocarsa-texto>

    <h2>Markdown</h2>
    <jocarsa-markdown name="documentacion"># Título

Texto con **negrita** y *cursiva*.</jocarsa-markdown>

    <h2>Editor de código</h2>
    <jocarsa-editor name="codigo" language="javascript">function hola(){
  console.log("Hola mundo");
}</jocarsa-editor>

    <h2>Firma</h2>
    <jocarsa-firma name="firma"></jocarsa-firma>

    <p><button type="submit">Enviar formulario</button></p>
  </form>
  <script src="jocarsa-ui.js"></script>
</body>
</html>
