<!doctype html>
<html lang="es">
  <head>
    <title>jocarsa | programa</title>
    <meta charset="utf-8">
    <link rel="shortcut icon" href="https://static.jocarsa.com/logos/white.svg" type="image/svg" />

    <style>
      :root{
        --tono:200;
        --saturacion:50%;
        --brillo:30%;
        --escalon:20%;
        
        --colorsecundario:lightsteelblue;
        --colortexto:white;
        --relleno:12px;
        --texto:12px;
        
        --chaflan:12px;
        --chaflan-si:0px;
        --chaflan-sd:var(--chaflan);
        --chaflan-id:0px;
        --chaflan-ii:0px;
        
        --color0:hsl(var(--tono),var(--saturacion),calc(var(--brillo) - var(--escalon)));
        --color:hsl(var(--tono),var(--saturacion),var(--brillo));
        --color2:hsl(var(--tono),var(--saturacion),calc(var(--brillo) + var(--escalon)));
        --color3:hsl(var(--tono),var(--saturacion),calc(var(--brillo) + calc(var(--escalon) * 2)));
        --color4:hsl(var(--tono),var(--saturacion),calc(var(--brillo) + calc(var(--escalon) * 3)));
        
        --colortextonav:hsl(0,0%,calc((var(--brillo) - 50%) * -1000));
        --colortextosection:hsl(0,0%,calc((var(--brillo) + var(--escalon) - 50%) * -1000));
      }
      
      *{box-sizing:border-box;}
      
      html{width:100%;height:100%;padding:0px;margin:0px;}
      
      body{margin:0px;}
      
      .jocarsa-iu{width:100%;height:100%;padding:0px;margin:0px;font-family:Ubuntu,sans-serif;
      display:flex;flex-direction:column;font-size:var(--texto);overflow:hidden;}
      
      .jocarsa-iu header{background:var(--color);display:flex;justify-content:space-between;
      padding:var(--relleno);color:var(--colortextonav);align-items:center;
      gap:var(--relleno);height:52px;flex:none;}
      
      .jocarsa-iu main{display:flex;flex:1;min-height:0;}
      
      .jocarsa-iu main nav{background:var(--color);flex:1;display:flex;flex-direction:column;
      padding:var(--relleno);box-sizing:border-box;gap:var(--relleno);padding-top:0px;
      color:var(--colortextonav);min-width:150px;}
      
      .jocarsa-iu main section{background:var(--color2);flex:1;padding:var(--relleno);
        gap:var(--relleno);
        display:flex;flex-direction:column;
        color:var(--colortextosection);
        min-width:150px;
        overflow-y:auto;
      }
        
      .jocarsa-iu main div{flex:4;background:var(--color3);}
      
      /* NAV */
      
      .jocarsa-iu main nav a{
        color:inherit;
        text-decoration:none;
        background:var(--color2);
        padding:var(--relleno);
        clip-path:polygon(
          var(--chaflan-si) 0,
          calc(100% - var(--chaflan-sd)) 0,
          100% var(--chaflan-sd),
          100% calc(100% - var(--chaflan-id)),
          calc(100% - var(--chaflan-id)) 100%,
          var(--chaflan-ii) 100%,
          0 calc(100% - var(--chaflan-ii)),
          0 var(--chaflan-si)
        );
        transition:all 1s;
        width:100%;
      }
      
      .jocarsa-iu main nav a:hover{
        background:var(--color3);
        width:calc(100% + calc(var(--relleno) * 0.9));
      }
      
      .jocarsa-iu main nav .activo{
        width:calc(100% + calc(var(--relleno) * 2));
      }
      
      /* SECTION */
      
      .jocarsa-iu main section article{
        background:var(--color3);
        padding:var(--relleno);
        clip-path:polygon(
          var(--chaflan-si) 0,
          calc(100% - var(--chaflan-sd)) 0,
          100% var(--chaflan-sd),
          100% calc(100% - var(--chaflan-id)),
          calc(100% - var(--chaflan-id)) 100%,
          var(--chaflan-ii) 100%,
          0 calc(100% - var(--chaflan-ii)),
          0 var(--chaflan-si)
        );
        transition:all 1s;
        width:100%;
      }
      
      .jocarsa-iu main section article:hover{
        background:var(--color4);
        width:calc(100% + calc(var(--relleno) * 0.9));
      }
      
      .jocarsa-iu main section .activo{
        width:calc(100% + calc(var(--relleno) * 2));
      }
      
      /* HEADER */
      
      .jocarsa-iu header .corporativo{
        display:flex;
        align-items:center;
        gap:var(--relleno);
        flex:1;
        height:100%;
      }
      
      .jocarsa-iu header .corporativo img{
        width:28px;
        height:28px;
      }
      
      .jocarsa-iu header .corporativo h1{
        padding:0px;
        margin:0px;
        font-size:14px;
        font-weight:normal;
        white-space:nowrap;
      }
      
      /* ESCENARIO */
      
      .jocarsa-iu main>div{
        padding:var(--relleno);
        overflow:auto;
        min-width:0;
      }
      
      .jocarsa-iu main>div table{
        width:100%;
        border-spacing:0px;
        border-collapse:collapse;
        background:white;
      }
      
      .jocarsa-iu main>div table caption{
        text-align:left;
        padding:var(--relleno);
        font-weight:bold;
        background:var(--color2);
      }
      
      .jocarsa-iu main>div table thead{
        background:var(--color);
      }
      
      .jocarsa-iu main>div table th,
      .jocarsa-iu main>div table td{
        padding:var(--relleno);
        border-bottom:1px solid var(--color2);
        text-align:left;
        white-space:nowrap;
      }
      
      .jocarsa-iu main>div table tbody tr:hover{
        background:var(--color3);
      }
      
      .jocarsa-iu main>div table tfoot{
        background:var(--color2);
        font-weight:bold;
      }
      
      /* HERRAMIENTAS */
      
      .jocarsa-iu header input{
        background:var(--color0);
        border:0px;
        padding:calc(var(--relleno) / 2);
        outline:none;
        height:28px;
        color:var(--colortextonav);
      }
      
      .jocarsa-iu header button,
      .jocarsa-iu header a{
        background:var(--color2);
        border:none;
        padding:calc(var(--relleno) / 2);
        height:28px;
        display:flex;
        align-items:center;
        color:var(--colortextonav);
        text-decoration:none;
        font:inherit;
      }
      
      .jocarsa-iu header #herramientas{
        display:flex;
        gap:var(--relleno);
        align-items:center;
        justify-content:center;
        flex:2;
        height:100%;
      }
      
      .jocarsa-iu header #usuario{
        display:flex;
        align-items:center;
        justify-content:flex-end;
        gap:var(--relleno);
        flex:1;
        height:100%;
      }
      
      .jocarsa-iu header #usuario .imagen{
        width:28px;
        height:28px;
        background:var(--color2);
        border-radius:100px;
        flex:none;
      }
      
      .jocarsa-iu header #usuario>div:last-child{
        background:transparent;
        flex:none;
        display:flex;
        align-items:center;
        gap:var(--relleno);
      }
      
      .jocarsa-iu header #usuario p{
        margin:0px;
        white-space:nowrap;
      }
    </style>
  </head>
  
  <body class="jocarsa-iu">
    
    <header>
      <div class="corporativo">
        <img src="https://static.jocarsa.com/logos/white.svg">
        <h1>jocarsa | programa</h1>
      </div>
      
      <div id="herramientas">
        <input type="text" placeholder="Buscar...">
        <button>Acción 1</button>
        <button>Acción 2</button>
      </div>
      
      <div id="usuario">
        <div class="imagen"></div>
        <div>
          <p>Jose Vicente Carratalá</p>
          <a href="">Cerrar sesión</a>
        </div>
      </div>
    </header>
    
    <main>
      
      <nav>
        <a href="">Entidad</a>
        <a href="" class="activo">Entidad</a>
        <a href="">Entidad</a>
        <a href="">Entidad</a>
        <a href="">Entidad</a>
        <a href="">Entidad</a>
      </nav>
      
      <section>
        <article>Elemento</article>
        <article>Elemento</article>
        <article class="activo">Elemento</article>
        <article>Elemento</article>
        <article>Elemento</article>
        <article>Elemento</article>
        <article>Elemento</article>
        <article>Elemento</article>
        <article>Elemento</article>
        <article>Elemento</article>
        <article>Elemento</article>
      </section>
      
      <div class="escenario">
        
        <table data-source="productos.json">
          
        </table>
        
      </div>
      
    </main>
    <script>

      function tablasDinamicas(){

        let tablas = document.querySelectorAll("table")

        tablas.forEach(function(tabla){

          // Solo procesamos tablas con data-source
          if(tabla.hasAttribute("data-source")){

            let origen = tabla.getAttribute("data-source")

            fetch(origen)
            .then(function(resultado){
              return resultado.json()
            })
            .then(function(datos){

              let campos = datos.campos
              let registros = datos.datos

              // CABECERA

              let cabecera = document.createElement("thead")
              let filaCabecera = document.createElement("tr")

              campos.forEach(function(campo){

                let celda = document.createElement("th")
                celda.textContent = campo.etiqueta

                filaCabecera.appendChild(celda)

              })

              cabecera.appendChild(filaCabecera)
              tabla.appendChild(cabecera)


              // CUERPO

              let cuerpo = document.createElement("tbody")

              registros.forEach(function(registro){

                let fila = document.createElement("tr")

                campos.forEach(function(campo){

                  let celda = document.createElement("td")
                  let valor = registro[campo.nombre]

                  // CHECKBOX / BOOLEAN
                  if(campo.tipo == "checkbox"){

                    let control = document.createElement("input")

                    control.setAttribute("type","checkbox")
                    control.disabled = true
                    control.checked = valor

                    celda.appendChild(control)

                  }

                  // RESTO DE CAMPOS
                  else{

                    celda.textContent = valor

                  }

                  fila.appendChild(celda)

                })

                cuerpo.appendChild(fila)

              })

              tabla.appendChild(cuerpo)

            })

          }

        })

      }

      tablasDinamicas()

    </script>
  </body>
</html>
