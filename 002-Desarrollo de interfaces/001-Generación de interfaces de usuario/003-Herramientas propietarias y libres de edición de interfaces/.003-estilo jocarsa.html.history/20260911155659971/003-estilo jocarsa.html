<!doctype html>
<html lang="es">
  <head>
    <style>
      :root{--color: blue;--colorsecundario: lightsteelblue;--colortexto: white;}
      html{width:100%;height:100%;padding:0px;}
      .jocarsa-iu{width:100%;height:100%;padding:0px;margin:0px;font-family:sans-serif;
      display:flex;flex-direction:column;}
      .jocarsa-iu header{background:var(--color);display:flex;justify-content:space-between;
      padding:10px;color:var(--colortexto);flex:1;align-items:center;}
      .jocarsa-iu main{display:flex;flex:20;}
      .jocarsa-iu main nav{background:var(--color);flex:1;display:flex;flex-direction:column;
      padding:10px;box-sizing:border-box;gap:10px;padding-top:0px;}
      .jocarsa-iu main section{background:var(--colorsecundario);flex:1;
        }
      .jocarsa-iu main div{flex:4;background:aliceblue;}
      .jocarsa-iu main nav a{color:inherit;text-decoration:none;
        background:var(--colorsecundario);padding:10px;
      }.jocarsa-iu main nav .activo{width: calc(100% + 10px);}
    </style>
  </head>
  <body class="jocarsa-iu">
    <header>
    	<div id="corporativo">Corporativo
      </div>
      <div id="herramientas">Herramientas
      </div>
      <div id="usuario">Usuario
      </div>
    </header>
    <main>
      <nav>
        <a href="">Entidad</a>
        <a href="" class="activo">Entidad</a>
        <a href="">Entidad</a>
        <a href="">Entidad</a>
        <a href="">Entidad</a>
        <a href="">Entidad</a>
      </nav>
      <section>
        <article>Elemento</article>
      </section>
      <div></div>
    </main>
  </body>
</html>
