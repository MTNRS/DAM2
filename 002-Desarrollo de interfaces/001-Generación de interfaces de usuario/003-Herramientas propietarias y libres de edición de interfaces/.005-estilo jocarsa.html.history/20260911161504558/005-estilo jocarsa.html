<!doctype html>
<html lang="es">
  <head>
    <style>
      :root{
        --tono:0;
        --saturacion:50%;
        --brillo:70%;
        --escalon:20%;
        
        --colorsecundario: lightsteelblue;
        --colortexto: white;
        --relleno:20px;
        
        --color: hsl(var(--tono),var(--saturacion),var(--brillo));
        --color2:hsl(var(--tono),var(--saturacion),calc(var(--brillo) + var(--escalon)));
        --color3:hsl(var(--tono),var(--saturacion),calc(var(--brillo) + calc(var(--escalon) * 2)));
        
        --colortextonav:hsl(0,0%,calc((var(--brillo) - 50%) * -1000));
        --colortextosection:hsl(0,0%,calc((var(--brillo) + var(--escalon) - 50%) * -1000));
      }
      
      html{width:100%;height:100%;padding:0px;}
      
      .jocarsa-iu{width:100%;height:100%;padding:0px;margin:0px;font-family:sans-serif;
      display:flex;flex-direction:column;}
      
      .jocarsa-iu header{background:var(--color);display:flex;justify-content:space-between;
      padding:var(--relleno);color:var(--colortextonav);flex:1;align-items:center;}
      
      .jocarsa-iu main{display:flex;flex:20;}
      
      .jocarsa-iu main nav{background:var(--color);flex:1;display:flex;flex-direction:column;
      padding:var(--relleno);box-sizing:border-box;gap:var(--relleno);padding-top:0px;
      color:var(--colortextonav);}
      
      .jocarsa-iu main section{background:var(--color2);flex:1;padding:var(--relleno);
        gap:var(--relleno);
        display:flex;flex-direction:column;
        color:var(--colortextosection);
        }
        
      .jocarsa-iu main div{flex:4;background:var(--color3);}
      
      .jocarsa-iu main nav a{color:inherit;text-decoration:none;
        background:var(--color2);padding:var(--relleno);
      }
      
      .jocarsa-iu main nav .activo{width: calc(100% + var(--relleno));}
      
      .jocarsa-iu main section article{background:var(--color3);padding:var(--relleno);}
      
      .jocarsa-iu main section .activo{width: calc(100% + var(--relleno));}
    </style>
  </head>
  <body class="jocarsa-iu">
    <header>
    	<div id="corporativo">Corporativo
      </div>
      <div id="herramientas">Herramientas
      </div>
      <div id="usuario">Usuario
      </div>
    </header>
    <main>
      <nav>
        <a href="">Entidad</a>
        <a href="" class="activo">Entidad</a>
        <a href="">Entidad</a>
        <a href="">Entidad</a>
        <a href="">Entidad</a>
        <a href="">Entidad</a>
      </nav>
      <section>
        <article>Elemento</article>
        <article>Elemento</article>
        <article class="activo">Elemento</article>
        <article>Elemento</article>
        <article>Elemento</article>
        <article>Elemento</article>
        <article>Elemento</article>
        <article>Elemento</article>
        <article>Elemento</article>
        <article>Elemento</article>
        <article>Elemento</article>
      </section>
      <div></div>
    </main>
  </body>
</html>
