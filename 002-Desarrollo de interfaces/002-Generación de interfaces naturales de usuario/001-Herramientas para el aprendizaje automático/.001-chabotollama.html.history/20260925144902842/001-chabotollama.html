<!doctype html>
<html>
  <head>
    <meta charset="utf-8">

    <style>

      body{
        font-family:Arial,sans-serif;
      }

      /* -------------------------
         VENTANA DEL CHAT
      ------------------------- */

      #chat{
        position:fixed;
        right:30px;
        bottom:105px;

        width:350px;
        height:450px;

        background:#f5f5f5;

        border-radius:15px;
        box-shadow:0 5px 30px #0004;

        display:none;
        flex-direction:column;

        overflow:hidden;
      }


      /* Cabecera */

      #cabecera{
        background:dodgerblue;
        color:white;

        padding:15px;

        display:flex;
        justify-content:space-between;
        align-items:center;

        font-weight:bold;
      }

      #cerrar{
        cursor:pointer;
        font-size:20px;
      }


      /* Conversación */

      #conversacion{
        flex:1;

        padding:20px;

        display:flex;
        flex-direction:column;
        gap:15px;

        overflow-y:auto;
      }


      /* Bocadillos */

      .bocadillo{
        padding:10px 15px;
        border-radius:18px;

        max-width:75%;

        line-height:1.4;
      }

      .yo{
        background:dodgerblue;
        color:white;

        align-self:flex-end;

        border-bottom-right-radius:4px;
      }

      .maquina{
        background:white;

        align-self:flex-start;

        border-bottom-left-radius:4px;

        box-shadow:0 2px 8px #0002;
      }


      /* -------------------------
         BOTÓN FLOTANTE
      ------------------------- */

      #microfono{
        position:fixed;

        right:30px;
        bottom:30px;

        width:60px;
        height:60px;

        border:0;
        border-radius:50%;

        background:dodgerblue;
        color:white;

        font-size:28px;

        cursor:pointer;

        box-shadow:0 4px 15px #0004;

        transition:0.2s;
      }

      #microfono:hover{
        transform:scale(1.1);
      }

    </style>
  </head>

  <body>


    <!-- Aquí estaría tu web normal -->

    <h1>Mi página web</h1>

    <p>
      Este es el contenido normal de mi página.
    </p>



    <!-- CHAT FLOTANTE -->

    <div id="chat">

      <div id="cabecera">

        <span>Asistente</span>

        <span id="cerrar" onclick="cerrarChat()">
          ×
        </span>

      </div>


      <div id="conversacion">

        <div class="bocadillo maquina">
          Hola, pulsa el micrófono y háblame.
        </div>

      </div>

    </div>



    <!-- BOTÓN FLOTANTE -->

    <button id="microfono" onclick="escuchar()">
      🎤
    </button>



    <script>

      function bocadillo(texto, quien){

        let mensaje = document.createElement("div");

        mensaje.classList.add("bocadillo");
        mensaje.classList.add(quien);

        mensaje.textContent = texto;

        let conversacion =
          document.querySelector("#conversacion");

        conversacion.appendChild(mensaje);


        // Scroll automático hacia abajo

        conversacion.scrollTop =
          conversacion.scrollHeight;

      }



      function escuchar(){

        // Mostrar chat

        document.querySelector("#chat").style.display = "flex";


        // Reconocimiento de voz

        let reconocimiento =
          new webkitSpeechRecognition();

        reconocimiento.lang = "es-ES";


        reconocimiento.onresult = function(evento){

          let texto =
            evento.results[0][0].transcript;


          // Mensaje usuario

          bocadillo(texto,"yo");


          // Respuesta de momento

          let respuesta = texto;


          // Mensaje máquina

          bocadillo(respuesta,"maquina");


          // Hablar

          let mensaje =
            new SpeechSynthesisUtterance(respuesta);

          mensaje.lang = "es-ES";

          speechSynthesis.speak(mensaje);

        };


        reconocimiento.start();

      }



      function cerrarChat(){

        document.querySelector("#chat")
          .style.display = "none";

      }

    </script>

  </body>
</html>
