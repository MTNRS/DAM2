<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Path Tracer 2D - Workers + OffscreenCanvas</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#020202;
}

canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    cursor:crosshair;
}

#panel{
    position:fixed;
    top:16px;
    left:16px;
    z-index:100;

    min-width:285px;

    padding:16px;

    background:rgba(10,10,10,.82);
    color:white;

    border:1px solid rgba(255,255,255,.12);
    border-radius:12px;

    backdrop-filter:blur(12px);

    font-family:monospace;
    font-size:12px;

    box-shadow:0 10px 40px #0008;
}

#panel h2{
    font-size:17px;
    margin-bottom:12px;
}

.estadisticas{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:5px 15px;

    margin-bottom:14px;
}

.valor{
    text-align:right;
    color:#ffd66b;
}

.control{
    display:grid;
    grid-template-columns:1fr 80px;
    gap:10px;

    align-items:center;

    margin-top:7px;
}

input{
    width:80px;

    padding:5px;

    background:#222;
    color:white;

    border:1px solid #555;
    border-radius:5px;

    font-family:monospace;
}

button{
    width:100%;

    margin-top:12px;
    padding:7px;

    background:#333;
    color:white;

    border:1px solid #555;
    border-radius:6px;

    cursor:pointer;
}

button:hover{
    background:#444;
}

#hardware{
    margin-top:10px;
    padding-top:10px;

    border-top:1px solid #333;

    color:#888;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div id="panel">

    <h2>Path Tracer 2D</h2>

    <div class="estadisticas">

        <div>FPS</div>
        <div class="valor" id="fps">0</div>

        <div>Rayos/s</div>
        <div class="valor" id="rps">0</div>

        <div>Muestras</div>
        <div class="valor" id="muestras">0</div>

        <div>Workers</div>
        <div class="valor" id="workersActivos">0</div>

    </div>


    <div class="control">

        <label>
            Workers
        </label>

        <input
            id="numeroWorkers"
            type="number"
            min="1"
            max="32"
            value="8"
        >

    </div>


    <div class="control">

        <label>
            Rayos / lote
        </label>

        <input
            id="rayosLote"
            type="number"
            min="10"
            max="2000"
            step="10"
            value="100"
        >

    </div>


    <button id="limpiar">
        Limpiar acumulación
    </button>

    <div id="hardware"></div>

</div>


<script>

// ============================================================
// CANVAS
// ============================================================

const canvas =
    document.querySelector("#canvas");

const ctx =
    canvas.getContext(
        "2d",
        {
            alpha:false
        }
    );


// ============================================================
// BUFFER DE ACUMULACIÓN
// ============================================================

const acumulacion =
    document.createElement("canvas");

const actx =
    acumulacion.getContext("2d");


// ============================================================
// VARIABLES
// ============================================================

let W;
let H;

let muros = [];

let workers = [];

let muestras = 0;

let rayosSegundo = 0;

let contadorRayosSegundo = 0;


// ============================================================
// RATÓN
// ============================================================

const raton = {

    x:
        window.innerWidth/2,

    y:
        window.innerHeight/2

};


// ============================================================
// CONFIGURACIÓN
// ============================================================

const MAX_REBOTES = 12;

const REFLECTANCIA = 0.58;

const PROB_ESPECULAR = 0.12;

const RUGOSIDAD = 0.12;

const INTENSIDAD_MINIMA = 0.005;


// ============================================================
// TEMPORAL ACCUMULATION
// ============================================================

// Cuanto mayor sea, más rápidamente
// desaparece la iluminación antigua.

const DECAY_POR_SEGUNDO = 0.35;


// ============================================================
// MUROS
// ============================================================

function muro(
    x1,
    y1,
    x2,
    y2
){

    muros.push({

        x1,
        y1,
        x2,
        y2

    });

}


// ============================================================
// LABERINTO
// ============================================================

function crearLaberinto(){

    muros = [];

    const m = 25;


    // borde

    muro(
        m,m,
        W-m,m
    );

    muro(
        W-m,m,
        W-m,H-m
    );

    muro(
        W-m,H-m,
        m,H-m
    );

    muro(
        m,H-m,
        m,m
    );


    // izquierda

    muro(
        W*0.25,
        H*0.10,
        W*0.25,
        H*0.42
    );

    muro(
        W*0.25,
        H*0.65,
        W*0.25,
        H*0.90
    );


    // centro

    muro(
        W*0.50,
        H*0.22,
        W*0.50,
        H*0.68
    );


    // derecha

    muro(
        W*0.75,
        H*0.10,
        W*0.75,
        H*0.36
    );

    muro(
        W*0.75,
        H*0.58,
        W*0.75,
        H*0.90
    );


    // horizontales

    muro(
        W*0.07,
        H*0.28,
        W*0.17,
        H*0.28
    );

    muro(
        W*0.34,
        H*0.16,
        W*0.64,
        H*0.16
    );

    muro(
        W*0.34,
        H*0.52,
        W*0.44,
        H*0.52
    );

    muro(
        W*0.58,
        H*0.43,
        W*0.90,
        H*0.43
    );

    muro(
        W*0.08,
        H*0.78,
        W*0.42,
        H*0.78
    );

    muro(
        W*0.59,
        H*0.80,
        W*0.90,
        H*0.80
    );

}


// ============================================================
// CÓDIGO DEL WORKER
// ============================================================

const codigoWorker = `

let W = 0;
let H = 0;

let muros = [];

let canvasWorker;
let ctx;

let MAX_REBOTES;
let REFLECTANCIA;
let PROB_ESPECULAR;
let RUGOSIDAD;
let INTENSIDAD_MINIMA;


// ============================================================
// INTERSECCIÓN
// ============================================================

function interseccion(
    px,
    py,
    dx,
    dy,
    m
){

    const sx =
        m.x2-m.x1;

    const sy =
        m.y2-m.y1;


    const denominador =
        dx*sy -
        dy*sx;


    if(
        Math.abs(denominador)
        <
        0.000001
    ){
        return null;
    }


    const qpx =
        m.x1-px;

    const qpy =
        m.y1-py;


    const t =
        (
            qpx*sy -
            qpy*sx
        )
        /
        denominador;


    const u =
        (
            qpx*dy -
            qpy*dx
        )
        /
        denominador;


    if(
        t > 0.001 &&
        u >= 0 &&
        u <= 1
    ){

        return {

            x:
                px +
                dx*t,

            y:
                py +
                dy*t,

            distancia:
                t,

            muro:
                m

        };

    }


    return null;

}


// ============================================================
// IMPACTO MÁS CERCANO
// ============================================================

function primerImpacto(
    x,
    y,
    dx,
    dy
){

    let mejor = null;


    for(
        let i=0;
        i<muros.length;
        i++
    ){

        const impacto =
            interseccion(
                x,
                y,
                dx,
                dy,
                muros[i]
            );


        if(
            impacto &&
            (
                mejor === null ||
                impacto.distancia
                <
                mejor.distancia
            )
        ){

            mejor =
                impacto;

        }

    }


    return mejor;

}


// ============================================================
// NORMAL
// ============================================================

function normalMuro(
    m,
    dx,
    dy
){

    let wx =
        m.x2-m.x1;

    let wy =
        m.y2-m.y1;


    const longitud =
        Math.hypot(
            wx,
            wy
        );


    wx /= longitud;
    wy /= longitud;


    let nx =
        -wy;

    let ny =
        wx;


    if(
        dx*nx +
        dy*ny
        >
        0
    ){

        nx =
            -nx;

        ny =
            -ny;

    }


    return {

        x:nx,
        y:ny

    };

}


// ============================================================
// REFLEXIÓN
// ============================================================

function reflejar(
    dx,
    dy,
    normal
){

    const dot =
        dx*normal.x +
        dy*normal.y;


    let rx =
        dx -
        2*dot*normal.x;

    let ry =
        dy -
        2*dot*normal.y;


    const longitud =
        Math.hypot(
            rx,
            ry
        );


    return {

        x:
            rx/longitud,

        y:
            ry/longitud

    };

}


// ============================================================
// LAMBERT
// ============================================================

function direccionLambertiana(
    normal
){

    const anguloNormal =
        Math.atan2(
            normal.y,
            normal.x
        );


    const u =
        Math.random();


    const desviacion =
        Math.asin(
            2*u-1
        );


    const angulo =
        anguloNormal +
        desviacion;


    return {

        x:
            Math.cos(angulo),

        y:
            Math.sin(angulo)

    };

}


// ============================================================
// ESPECULAR
// ============================================================

function direccionEspecular(
    dx,
    dy,
    normal
){

    const r =
        reflejar(
            dx,
            dy,
            normal
        );


    let angulo =
        Math.atan2(
            r.y,
            r.x
        );


    angulo +=
        (
            Math.random()-0.5
        )
        *
        RUGOSIDAD;


    return {

        x:
            Math.cos(angulo),

        y:
            Math.sin(angulo)

    };

}


// ============================================================
// PATH
// ============================================================

function lanzarPath(
    origenX,
    origenY,
    angulo
){

    let x =
        origenX;

    let y =
        origenY;


    let dx =
        Math.cos(
            angulo
        );

    let dy =
        Math.sin(
            angulo
        );


    let energia = 1;


    for(
        let rebote=0;
        rebote<MAX_REBOTES;
        rebote++
    ){

        if(
            energia <
            INTENSIDAD_MINIMA
        ){
            break;
        }


        const impacto =
            primerImpacto(
                x,
                y,
                dx,
                dy
            );


        if(!impacto){
            break;
        }


        // ================================================
        // ATENUACIÓN
        // ================================================

        const distancia =
            impacto.distancia;


        const atenuacion =
            1 /
            (
                1 +
                distancia*0.0008
            );


        const intensidad =
            energia *
            atenuacion;


        // ================================================
        // PINTAR DIRECTAMENTE EN EL WORKER
        // ================================================

        const alpha =
            Math.min(
                0.12,
                0.020
                *
                intensidad
            );


        ctx.strokeStyle =
            "rgba(255,210,110,"
            +
            alpha
            +
            ")";


        ctx.beginPath();

        ctx.moveTo(
            x,
            y
        );

        ctx.lineTo(
            impacto.x,
            impacto.y
        );

        ctx.stroke();


        energia *=
            atenuacion;


        // ================================================
        // NORMAL
        // ================================================

        const normal =
            normalMuro(
                impacto.muro,
                dx,
                dy
            );


        const cosIncidencia =
            Math.max(
                0,
                -(
                    dx*normal.x +
                    dy*normal.y
                )
            );


        // ================================================
        // FRESNEL
        // ================================================

        const fresnel =
            PROB_ESPECULAR
            +
            (
                1-PROB_ESPECULAR
            )
            *
            Math.pow(
                1-cosIncidencia,
                5
            );


        // ================================================
        // MONTE CARLO
        // ================================================

        if(
            Math.random()
            <
            fresnel
        ){

            const direccion =
                direccionEspecular(
                    dx,
                    dy,
                    normal
                );


            dx =
                direccion.x;

            dy =
                direccion.y;

        }
        else{

            const direccion =
                direccionLambertiana(
                    normal
                );


            dx =
                direccion.x;

            dy =
                direccion.y;

        }


        energia *=
            REFLECTANCIA;


        // ================================================
        // RUSSIAN ROULETTE
        // ================================================

        if(
            rebote >= 3
        ){

            const supervivencia =
                Math.min(
                    0.92,
                    energia
                );


            if(
                Math.random()
                >
                supervivencia
            ){
                break;
            }


            energia /=
                supervivencia;

        }


        x =
            impacto.x +
            dx*0.5;

        y =
            impacto.y +
            dy*0.5;

    }

}


// ============================================================
// MENSAJES
// ============================================================

self.onmessage =
function(e){

    const datos =
        e.data;


    // ========================================================
    // INICIALIZACIÓN
    // ========================================================

    if(
        datos.tipo === "init"
    ){

        W =
            datos.W;

        H =
            datos.H;

        muros =
            datos.muros;


        MAX_REBOTES =
            datos.MAX_REBOTES;

        REFLECTANCIA =
            datos.REFLECTANCIA;

        PROB_ESPECULAR =
            datos.PROB_ESPECULAR;

        RUGOSIDAD =
            datos.RUGOSIDAD;

        INTENSIDAD_MINIMA =
            datos.INTENSIDAD_MINIMA;


        canvasWorker =
            new OffscreenCanvas(
                W,
                H
            );


        ctx =
            canvasWorker.getContext(
                "2d"
            );


        ctx.lineWidth =
            1.2;


        ctx.globalCompositeOperation =
            "lighter";


        self.postMessage({
            tipo:"ready"
        });


        return;

    }


    // ========================================================
    // RENDER
    // ========================================================

    if(
        datos.tipo === "render"
    ){

        // ----------------------------------------------
        // limpiar SOLO el pequeño frame del worker
        // ----------------------------------------------

        ctx.globalCompositeOperation =
            "source-over";

        ctx.clearRect(
            0,
            0,
            W,
            H
        );


        ctx.globalCompositeOperation =
            "lighter";


        // ----------------------------------------------
        // paths
        // ----------------------------------------------

        for(
            let i=0;
            i<datos.rayos;
            i++
        ){

            const angulo =
                Math.random()
                *
                Math.PI*2;


            lanzarPath(
                datos.x,
                datos.y,
                angulo
            );

        }


        // ----------------------------------------------
        // TRANSFERIR IMAGEN
        // ----------------------------------------------

        const bitmap =
            canvasWorker
            .transferToImageBitmap();


        self.postMessage(
            {
                tipo:
                    "bitmap",

                bitmap:
                    bitmap,

                rayos:
                    datos.rayos
            },
            [
                bitmap
            ]
        );

    }

};

`;


// ============================================================
// BLOB
// ============================================================

const blob =
    new Blob(
        [codigoWorker],
        {
            type:
                "application/javascript"
        }
    );


const workerURL =
    URL.createObjectURL(
        blob
    );


// ============================================================
// CREAR WORKERS
// ============================================================

function crearWorkers(){

    // destruir anteriores

    for(
        const item of workers
    ){

        item.worker.terminate();

    }


    workers = [];


    let cantidad =
        parseInt(
            document.querySelector(
                "#numeroWorkers"
            ).value
        );


    cantidad =
        Math.max(
            1,
            Math.min(
                32,
                cantidad || 8
            )
        );


    document.querySelector(
        "#numeroWorkers"
    ).value =
        cantidad;


    // ========================================================
    // CREACIÓN
    // ========================================================

    for(
        let i=0;
        i<cantidad;
        i++
    ){

        const worker =
            new Worker(
                workerURL
            );


        const item = {

            worker:
                worker,

            listo:
                false

        };


        worker.onmessage =
        function(e){

            const datos =
                e.data;


            // ================================================
            // READY
            // ================================================

            if(
                datos.tipo === "ready"
            ){

                item.listo =
                    true;


                mandarTrabajo(
                    item
                );


                return;

            }


            // ================================================
            // BITMAP TERMINADO
            // ================================================

            if(
                datos.tipo === "bitmap"
            ){

                // ------------------------------------------
                // COMPOSICIÓN
                // ------------------------------------------

                actx.globalCompositeOperation =
                    "lighter";


                actx.drawImage(
                    datos.bitmap,
                    0,
                    0,
                    W,
                    H
                );


                datos.bitmap.close();


                // ------------------------------------------
                // ESTADÍSTICAS
                // ------------------------------------------

                muestras +=
                    datos.rayos;


                contadorRayosSegundo +=
                    datos.rayos;


                // ------------------------------------------
                // EL WORKER NO ESPERA AL FRAME
                //
                // recibe inmediatamente otro trabajo
                // ------------------------------------------

                mandarTrabajo(
                    item
                );

            }

        };


        worker.onerror =
        function(error){

            console.error(
                error
            );

        };


        workers.push(
            item
        );


        // ====================================================
        // INIT
        // ====================================================

        worker.postMessage({

            tipo:
                "init",

            W:
                W,

            H:
                H,

            muros:
                muros,

            MAX_REBOTES:
                MAX_REBOTES,

            REFLECTANCIA:
                REFLECTANCIA,

            PROB_ESPECULAR:
                PROB_ESPECULAR,

            RUGOSIDAD:
                RUGOSIDAD,

            INTENSIDAD_MINIMA:
                INTENSIDAD_MINIMA

        });

    }


    document.querySelector(
        "#workersActivos"
    ).textContent =
        cantidad;

}


// ============================================================
// MANDAR TRABAJO
// ============================================================

function mandarTrabajo(
    item
){

    if(
        !item.listo
    ){
        return;
    }


    let rayos =
        parseInt(
            document.querySelector(
                "#rayosLote"
            ).value
        );


    rayos =
        Math.max(
            10,
            Math.min(
                2000,
                rayos || 100
            )
        );


    item.worker.postMessage({

        tipo:
            "render",

        x:
            raton.x,

        y:
            raton.y,

        rayos:
            rayos

    });

}


// ============================================================
// REDIMENSIONAR
// ============================================================

function redimensionar(){

    const dpr =
        window.devicePixelRatio
        ||
        1;


    W =
        window.innerWidth;

    H =
        window.innerHeight;


    canvas.width =
        W*dpr;

    canvas.height =
        H*dpr;


    canvas.style.width =
        W+"px";

    canvas.style.height =
        H+"px";


    ctx.setTransform(
        dpr,0,
        0,dpr,
        0,0
    );


    // ========================================================
    // BUFFER
    //
    // Lo mantenemos a resolución CSS.
    //
    // Esto reduce muchísimo el coste de los ImageBitmap.
    // ========================================================

    acumulacion.width =
        W;

    acumulacion.height =
        H;


    crearLaberinto();


    muestras = 0;


    crearWorkers();

}


// ============================================================
// RATÓN
// ============================================================

canvas.addEventListener(
    "mousemove",
    function(e){

        const rect =
            canvas.getBoundingClientRect();


        raton.x =
            e.clientX -
            rect.left;

        raton.y =
            e.clientY -
            rect.top;


        // ====================================================
        // NO SE BORRA NADA
        //
        // Los workers siguientes reciben automáticamente
        // la nueva posición.
        // ====================================================

    }
);


// ============================================================
// LIMPIAR
// ============================================================

function limpiar(){

    actx.globalCompositeOperation =
        "source-over";


    actx.clearRect(
        0,
        0,
        W,
        H
    );


    muestras = 0;

}


document.querySelector(
    "#limpiar"
).onclick =
    limpiar;


// ============================================================
// CAMBIO DE WORKERS
// ============================================================

document.querySelector(
    "#numeroWorkers"
).addEventListener(
    "change",
    crearWorkers
);


// ============================================================
// DECAY TEMPORAL
// ============================================================

let ultimoDecay =
    performance.now();


function decayTemporal(){

    const ahora =
        performance.now();


    const dt =
        (
            ahora -
            ultimoDecay
        )
        /
        1000;


    ultimoDecay =
        ahora;


    // ========================================================
    // Fade independiente de FPS
    // ========================================================

    const alpha =
        1 -
        Math.exp(
            -DECAY_POR_SEGUNDO
            *
            dt
        );


    actx.globalCompositeOperation =
        "source-over";


    actx.fillStyle =
        "rgba(2,2,2,"
        +
        alpha
        +
        ")";


    actx.fillRect(
        0,
        0,
        W,
        H
    );

}


// ============================================================
// DIBUJAR MUROS
// ============================================================

function dibujarMuros(){

    ctx.lineCap =
        "round";

    ctx.lineJoin =
        "round";


    // ========================================================
    // SOMBRA
    // ========================================================

    ctx.beginPath();


    for(
        const m of muros
    ){

        ctx.moveTo(
            m.x1,
            m.y1
        );

        ctx.lineTo(
            m.x2,
            m.y2
        );

    }


    ctx.strokeStyle =
        "#000";

    ctx.lineWidth =
        14;

    ctx.stroke();


    // ========================================================
    // CUERPO
    // ========================================================

    ctx.beginPath();


    for(
        const m of muros
    ){

        ctx.moveTo(
            m.x1,
            m.y1
        );

        ctx.lineTo(
            m.x2,
            m.y2
        );

    }


    ctx.strokeStyle =
        "#444";

    ctx.lineWidth =
        7;

    ctx.stroke();


    // ========================================================
    // SUPERFICIE
    // ========================================================

    ctx.beginPath();


    for(
        const m of muros
    ){

        ctx.moveTo(
            m.x1,
            m.y1
        );

        ctx.lineTo(
            m.x2,
            m.y2
        );

    }


    ctx.strokeStyle =
        "#999";

    ctx.lineWidth =
        2;

    ctx.stroke();

}


// ============================================================
// FUENTE
// ============================================================

function dibujarFuente(){

    const radio =
        65;


    const gradiente =
        ctx.createRadialGradient(

            raton.x,
            raton.y,
            0,

            raton.x,
            raton.y,
            radio

        );


    gradiente.addColorStop(
        0,
        "rgba(255,255,255,1)"
    );

    gradiente.addColorStop(
        0.08,
        "rgba(255,250,200,1)"
    );

    gradiente.addColorStop(
        0.25,
        "rgba(255,210,80,.6)"
    );

    gradiente.addColorStop(
        0.60,
        "rgba(255,130,20,.12)"
    );

    gradiente.addColorStop(
        1,
        "rgba(255,100,0,0)"
    );


    ctx.fillStyle =
        gradiente;


    ctx.beginPath();

    ctx.arc(
        raton.x,
        raton.y,
        radio,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
        raton.x,
        raton.y,
        4,
        0,
        Math.PI*2
    );


    ctx.fillStyle =
        "white";

    ctx.fill();

}


// ============================================================
// FPS
// ============================================================

let frames = 0;

let fps = 0;

let ultimoFPS =
    performance.now();


// ============================================================
// RENDER
// ============================================================

function render(){

    const ahora =
        performance.now();


    frames++;


    if(
        ahora -
        ultimoFPS
        >=
        1000
    ){

        fps =
            Math.round(
                frames
                *
                1000
                /
                (
                    ahora -
                    ultimoFPS
                )
            );


        rayosSegundo =
            contadorRayosSegundo;


        frames = 0;

        contadorRayosSegundo = 0;

        ultimoFPS =
            ahora;


        document.querySelector(
            "#fps"
        ).textContent =
            fps;


        document.querySelector(
            "#rps"
        ).textContent =
            rayosSegundo
            .toLocaleString();


        document.querySelector(
            "#muestras"
        ).textContent =
            muestras
            .toLocaleString();

    }


    // ========================================================
    // DECAY
    // ========================================================

    decayTemporal();


    // ========================================================
    // FONDO
    // ========================================================

    ctx.globalCompositeOperation =
        "source-over";


    ctx.fillStyle =
        "#020202";


    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    // ========================================================
    // ACUMULACIÓN
    // ========================================================

    ctx.globalCompositeOperation =
        "lighter";


    ctx.drawImage(
        acumulacion,
        0,
        0,
        W,
        H
    );


    // ========================================================
    // MUROS
    // ========================================================

    ctx.globalCompositeOperation =
        "source-over";


    dibujarMuros();


    // ========================================================
    // FUENTE
    // ========================================================

    ctx.globalCompositeOperation =
        "lighter";


    dibujarFuente();


    ctx.globalCompositeOperation =
        "source-over";


    requestAnimationFrame(
        render
    );

}


// ============================================================
// HARDWARE
// ============================================================

const hardware =
    navigator.hardwareConcurrency
    ||
    "?";


document.querySelector(
    "#hardware"
).textContent =
    "hardwareConcurrency: "
    +
    hardware;


// ============================================================
// RESIZE
// ============================================================

let temporizadorResize;


window.addEventListener(
    "resize",
    function(){

        clearTimeout(
            temporizadorResize
        );


        temporizadorResize =
            setTimeout(
                redimensionar,
                150
            );

    }
);


// ============================================================
// START
// ============================================================

redimensionar();

render();

</script>
