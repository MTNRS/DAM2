<!doctype html>
<html>
<head>
  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    html, body{
      width:100%;
      height:100%;
      overflow:hidden;
      background:black;
    }

    canvas{
      display:block;
      width:100%;
      height:100%;
    }
  </style>
</head>
<body>

<canvas></canvas>

<script>

  let canvas = document.querySelector("canvas")
  let contexto = canvas.getContext("2d")

  function redimensionar(){
    canvas.width = window.innerWidth
    canvas.height = window.innerHeight
  }

  redimensionar()

  window.addEventListener("resize", redimensionar)


  class Ser{

    constructor(){

      this.x = Math.random() * canvas.width
      this.y = Math.random() * canvas.height

      this.angulo = Math.random() * Math.PI * 2

      this.hambre = Math.random() * 100
      this.energia = Math.random() * 100

      this.velocidad = 0.5 + Math.random() * 1.5
    }


    mover(){

      this.x += Math.cos(this.angulo) * this.velocidad
      this.y += Math.sin(this.angulo) * this.velocidad


      // Rebote horizontal

      if(this.x < 0){

        this.x = 0
        this.angulo = Math.PI - this.angulo

      }

      if(this.x > canvas.width){

        this.x = canvas.width
        this.angulo = Math.PI - this.angulo

      }


      // Rebote vertical

      if(this.y < 0){

        this.y = 0
        this.angulo = -this.angulo

      }

      if(this.y > canvas.height){

        this.y = canvas.height
        this.angulo = -this.angulo

      }

    }


    dibujar(){

      contexto.fillRect(
        this.x,
        this.y,
        2,
        2
      )

    }

  }



  let seres = []

  let numeroSeres = 10000


  // Crear seres

  for(let i = 0; i < numeroSeres; i++){

    seres.push(
      new Ser()
    )

  }



  function bucle(){

    // Limpiar pantalla

    contexto.fillStyle = "black"

    contexto.fillRect(
      0,
      0,
      canvas.width,
      canvas.height
    )


    // Dibujar seres

    contexto.fillStyle = "white"

    for(let ser of seres){

      ser.mover()

      ser.dibujar()

    }


    requestAnimationFrame(bucle)

  }


  bucle()

</script>

</body>
</html>
