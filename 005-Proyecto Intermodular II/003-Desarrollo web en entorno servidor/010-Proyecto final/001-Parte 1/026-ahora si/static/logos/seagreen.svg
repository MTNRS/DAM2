<svg xmlns="http://www.w3.org/2000/svg"
     width="256"
     height="256"
     viewBox="71.5 81.7 67.73 67.73">

  <defs>
    <linearGradient id="light" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fff"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="shadow" x1="0" y1="1" x2="0" y2="0">
      <stop stop-color="#000"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </linearGradient>

    <filter id="blur">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>
  </defs>

  <!-- Main hexagon -->
  <path d="M105.51 90.14
           127.32 102.73
           127.32 127.91
           105.51 140.5
           83.7 127.91
           83.7 102.73Z"
        fill="#2E8B57"
        stroke="#000"
        stroke-width="5.25"
        stroke-linejoin="round"/>

  <!-- Upper highlight -->
  <path d="M105.51 90.14
           127.32 102.73
           105.51 115.32
           83.7 102.73Z"
        fill="url(#light)"/>

  <!-- Lower shadow -->
  <path d="M83.7 127.91
           105.51 115.32
           127.32 127.91
           105.51 140.5Z"
        fill="url(#shadow)"
        opacity=".71"
        filter="url(#blur)"/>

</svg>
