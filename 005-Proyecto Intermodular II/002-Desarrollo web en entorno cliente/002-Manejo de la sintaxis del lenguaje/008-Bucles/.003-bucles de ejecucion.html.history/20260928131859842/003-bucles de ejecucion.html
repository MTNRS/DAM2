<div id="contador">
</div>
<script>
  let temporizador = setTimeout("bucle()",1000)
  let contador = 0;
  let contenedor_contador = document.querySelector("#contador")
  
  function bucle(){
    contador++;
    contenedor_contador.textContent = contador
  	clearTimeout(temporizador)
    temporizador = setTimeout("bucle()",1000)
  }
</script>
