<!doctype html>
<html>
  <head>
    <style>
      #calendario{width:800px;height:500px;display:grid;}
    </style>
  </head>
  <body>
    <div id="calendario">
    </div>
    <script>
      let contenedor = document.querySelector("#calendario")
      for(let dia = 1;dia<31;dia++){
        elemento = document.createElement("div")
        elemento.textContent = dia
        contenedor.appendChild(elemento)
      }
    </script>
  </body>
</html>
