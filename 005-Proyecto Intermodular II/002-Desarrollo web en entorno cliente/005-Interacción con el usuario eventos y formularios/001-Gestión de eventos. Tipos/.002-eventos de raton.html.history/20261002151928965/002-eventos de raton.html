<button>
  Pulsame
</button>
<script>
  let boton = document.querySelector("button")
  boton.onclick = function(){
  	console.log("Has hecho click en el boton")
  }
  boton.ondblclick = function(){
  	console.log("Has hecho doble click en el boton")
  }
  boton.onmousedown = function(){
  	console.log("Has hecho click hacia abajo en el boton")
  }
  boton.onmouseup = function(){
  	console.log("Has hecho click hacia arriba en el boton")
  }
  boton.onmousemove = function(){
  	console.log("Te has movido encima del boton")
  }
  boton.onmouseenter = function(){
  	console.log("Has entrado en el boton")
  }
  boton.onmouseleave = function(){
  	console.log("Has salido el boton")
  }
  boton.onmouseover = function(){
  	console.log("Estás encima del boton")
  }
  boton.onmouseout = function(){
  	console.log("Estás fuera del boton")
  }
  boton.concontextmenu = function(){
  	console.log("Has hecho click derecho en el boton")
    return false;
  }
</script>
