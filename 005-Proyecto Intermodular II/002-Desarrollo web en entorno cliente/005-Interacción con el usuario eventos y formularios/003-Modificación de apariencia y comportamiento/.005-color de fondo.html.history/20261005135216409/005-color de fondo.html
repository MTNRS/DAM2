<!doctype html>
<html>
  <head>
    <style>
      input[type=checkbox]{
  appearance:none;
  width:100px;
  height:50px;
  display:block;
  position:relative;
  border-radius:100px;
  cursor:pointer;
  background:red;
  transition:0.3s;
}

input[type=checkbox]::after{
  content:"";
  position:absolute;
  width:40px;
  height:40px;
  border-radius:50%;
  background:white;

  left:5px;
  top:5px;

  transition:0.3s;
}

input[type=checkbox]:checked{
  background:green;
}

input[type=checkbox]:checked::after{
  left:55px;
}
    </style>
  </head>
  <body>
    <input type="checkbox">
  </body>
</html>
