<!doctype html>
<html>
  <head>
    <style>
      input[type=checkbox]{
        appearance:none;
        border:1px solid grey;
        width:100px;
        height:50px;
        display:block;
        position:relative;
        border-radius:100px;
        cursor:pointer;
        background:red;
      }

      input[type=checkbox]::after{
        content:"";
        position:absolute;
        width:40px;
        height:40px;
        border-radius:50%;
        background:red;

        left:5px;
        top:4px;

        transition:0.3s;
      }

      input[type=checkbox]:checked::after{
        left:53px;
        background:green;
      }
    </style>
  </head>
  <body>
    <input type="checkbox">
  </body>
</html>
