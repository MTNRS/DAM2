<!doctype html>
<html>
  <head>
    <style>
      input[type=checkbox]{
        appearance:none;
        border:1px solid grey;
        width:100px;
        height:50px;
        display:block;
        position:relative;
      }

      input[type=checkbox]::after{
        content:"";
        position:absolute;
        width:40px;
        height:40px;
        border-radius:50%;
        background:grey;

        left:5px;
        top:5px;
      }
    </style>
  </head>
  <body>
    <input type="checkbox">
  </body>
</html>
