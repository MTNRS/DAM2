<!doctype html>
<html>
  <head>
    <style>
      input[type=checkbox]{
        appearance:none;
        width:100px;
        height:50px;
        display:block;
        position:relative;
        border-radius:100px;
        cursor:pointer;
        background:red;
        transition:0.3s;

        box-shadow:0px 0px 10px rgba(0,0,0,0.3) inset;

        /* Chaflán superior derecho */
        clip-path:polygon(
          0 0,
          calc(100% - 12px) 0,
          100% 12px,
          100% 100%,
          0 100%
        );
      }

      input[type=checkbox]::after{
        content:"";
        position:absolute;
        width:40px;
        height:40px;

        border-radius:50%;
        background:white;

        left:5px;
        top:5px;

        transition:0.3s;
        box-shadow:0px 0px 10px rgba(0,0,0,0.3);

        /* Chaflán superior derecho */
        clip-path:polygon(
          0 0,
          calc(100% - 8px) 0,
          100% 8px,
          100% 100%,
          0 100%
        );
      }

      input[type=checkbox]:checked{
        background:green;
      }

      input[type=checkbox]:checked::after{
        left:55px;
      }
    </style>
  </head>
  <body>
    <input type="checkbox">
  </body>
</html>
