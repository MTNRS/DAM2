<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Formulario HTML puro</title>
</head>
<body>

<h1>Formulario</h1>

<form method="post" action="procesa.php">

    <label for="nombre">Nombre</label>
    <input type="text" id="nombre" name="nombre">

    <br><br>

    <label for="email">Correo electrónico</label>
    <input type="email" id="email" name="email">

    <br><br>

    <label for="password">Contraseña</label>
    <input type="password" id="password" name="password">

    <br><br>

    <label for="edad">Edad</label>
    <input type="number" id="edad" name="edad">

    <br><br>

    <label for="fecha">Fecha</label>
    <input type="date" id="fecha" name="fecha">

    <br><br>

    <label for="color">Color</label>
    <input type="color" id="color" name="color">

    <br><br>

    <label for="archivo">Archivo</label>
    <input type="file" id="archivo" name="archivo">

    <br><br>

    <label for="provincia">Provincia</label>
    <select id="provincia" name="provincia">
        <option value="">Selecciona una provincia</option>
        <option value="valencia">Valencia</option>
        <option value="alicante">Alicante</option>
        <option value="castellon">Castellón</option>
    </select>

    <br><br>

    <label for="comentarios">Comentarios</label>
    <textarea id="comentarios" name="comentarios"></textarea>

    <br><br>

    <input type="checkbox" id="condiciones" name="condiciones">
    <label for="condiciones">Acepto las condiciones</label>

    <br><br>

    <input type="radio" id="particular" name="tipo" value="particular">
    <label for="particular">Particular</label>

    <input type="radio" id="empresa" name="tipo" value="empresa">
    <label for="empresa">Empresa</label>

    <br><br>

    <input type="submit" value="Enviar">

</form>

</body>
</html>
