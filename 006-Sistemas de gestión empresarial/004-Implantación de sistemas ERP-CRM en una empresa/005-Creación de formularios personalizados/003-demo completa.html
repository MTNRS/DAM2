<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>jocarsa | formularios</title><style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#25243a;background:#f5f4fb}*{box-sizing:border-box}body{margin:0}header{background:white;border-bottom:1px solid #e6e3f0;padding:17px 28px;display:flex;align-items:center;justify-content:space-between;gap:12px}header strong{font-size:21px;color:#4338ca}header span{color:#77748b;font-size:13px}.layout{display:grid;grid-template-columns:245px minmax(0,1fr) 370px;gap:18px;padding:22px;max-width:1700px;margin:auto}.panel{background:white;border:1px solid #e8e5f1;border-radius:14px;padding:20px;box-shadow:0 4px 16px #29204b08;min-width:0}h2{font-size:16px;margin:0 0 16px}h3{font-size:13px;color:#77748b;margin:20px 0 10px}button,select,input,textarea{font:inherit}button{cursor:pointer}.navbutton{display:block;width:100%;text-align:left;border:0;background:transparent;padding:12px;border-radius:9px;color:#4e4a62;margin:3px 0}.navbutton.active{background:#eeecff;color:#4338ca;font-weight:700}.muted{color:#77748b;font-size:13px;line-height:1.5}.topline{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}.pill{font-size:11px;background:#e9e7ff;color:#4338ca;padding:5px 9px;border-radius:30px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px}.field{display:flex;flex-direction:column;gap:7px;min-width:0}.field.wide{grid-column:1/-1}.field label,.legend{font-size:13px;font-weight:650;color:#3b3752}.field input:not([type=checkbox]):not([type=radio]),.field textarea,.field select{width:100%;border:1px solid #dcd9e7;border-radius:8px;padding:10px 12px;background:#fff;min-height:41px;color:#29253d}.field textarea{min-height:90px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{outline:2px solid #a5a0ff;outline-offset:1px}.field input[type=color]{padding:3px!important;height:43px}.field input[type=range]{padding:0!important}.field input[type=file]{font-size:12px}.help{font-size:11px;color:#88839a}.checkline{display:flex;align-items:center;gap:8px;font-size:13px}.options{display:flex;gap:14px;flex-wrap:wrap}.coords{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap}.primary{border:0;background:#4f46e5;color:white;border-radius:8px;padding:11px 18px;font-weight:650}.secondary{border:1px solid #dcd9e7;background:white;color:#49445f;border-radius:8px;padding:10px 16px}.tabs{display:flex;gap:5px;border-bottom:1px solid #eceaf3;padding-bottom:12px;margin-bottom:13px}.tab{background:transparent;border:0;padding:8px 10px;border-radius:7px;color:#77748b}.tab.active{background:#eeecff;color:#4338ca;font-weight:700}pre{font-size:11px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;background:#f7f6fb;border:1px solid #eceaf3;border-radius:8px;padding:13px;max-height:65vh;overflow:auto}.notice{margin-top:14px;padding:10px;border-radius:8px;background:#f0fdf4;color:#166534;font-size:13px;display:none}.notice.visible{display:block}.count{font-size:12px;color:#8c88a0}footer{text-align:center;color:#9691a6;font-size:12px;padding:15px}@media(max-width:1100px){.layout{grid-template-columns:200px minmax(0,1fr)}.inspector{grid-column:1/-1}}@media(max-width:680px){header{padding:15px}.layout{display:block;padding:12px}.panel{margin-bottom:12px}.fields{grid-template-columns:1fr}.field.wide{grid-column:auto}}
</style></head><body><header><strong>jocarsa <span style="color:#a6a0bb">|</span> formularios</strong><span>Demo frontend · sin conexión al backend</span></header><main class="layout"><aside class="panel"><h2>Formularios de ejemplo</h2><div id="navigation"></div><h3>Motor</h3><p class="muted">JocarsaBBDD · 36 tipos mapeados a controles HTML. Los datos de esta demostración son ficticios.</p><p class="muted" id="typecount"></p></aside><section class="panel"><div class="topline"><div><h2 id="formtitle" style="margin:0 0 5px"></h2><span class="muted" id="formdesc"></span></div><span class="pill">Vista previa</span></div><form id="generated"><div id="fields" class="fields"></div><div class="actions"><button class="primary" type="submit">Simular guardado</button><button class="secondary" type="reset">Restablecer</button></div></form><div id="notice" class="notice" role="status"></div></section><aside class="panel inspector"><div class="topline"><h2 style="margin:0">Inspector JSON</h2><button class="secondary" id="copy" type="button">Copiar</button></div><div class="tabs"><button class="tab active" data-tab="schema">Esquema</button><button class="tab" data-tab="values">Valores</button><button class="tab" data-tab="types">Tipos</button></div><pre id="output"></pre></aside></main><footer>jocarsa | formularios · demostración local sin persistencia</footer><script>
'use strict';
const TYPE_MAP={TEXTO:'text',ENTERO:'number',REAL:'number',BOOLEANO:'checkbox',FECHA:'date',DECIMAL:'number',ENTERO_MUY_PEQUENO:'number',ENTERO_PEQUENO:'number',ENTERO_MEDIANO:'number',ENTERO_GRANDE:'number',REAL_DOBLE:'number',BIT:'checkbox',CARACTER:'text',TEXTO_VARIABLE:'text',TEXTO_CORTO:'textarea',TEXTO_MEDIO:'textarea',TEXTO_LARGO:'textarea',HORA:'time',FECHA_HORA:'datetime-local',MARCA_TIEMPO:'datetime-local',ANIO:'number',CORREO:'email',CONTRASENA:'password',TELEFONO:'tel',DIRECCION_WEB:'url',BUSQUEDA:'search',COLOR:'color',RANGO:'range',ENUMERACION:'select',CONJUNTO:'checkbox-group',JSON:'textarea',BINARIO:'file',BINARIO_LARGO:'file',PUNTO:'point',PROGRESO:'progress',MEDIDOR:'meter'};
const c=(nombre,tipo,valor='',extra={})=>({nombre,titulo:nombre.replaceAll('_',' ').replace(/^./,x=>x.toUpperCase()),tipo,valor,...extra});
const DEMOS=[
 {titulo:'Cliente',descripcion:'Datos generales y comerciales',campos:[c('nombre','TEXTO','Ana García',{requerido:true}),c('edad','ENTERO',28,{min:0,max:120}),c('correo','CORREO','ana@ejemplo.com',{requerido:true}),c('telefono','TELEFONO','600123456'),c('alta','FECHA','2026-11-05'),c('saldo','DECIMAL',1450.25,{step:0.01}),c('activo','BOOLEANO',true),c('departamento','ENUMERACION','ventas',{opciones:[{valor:'ventas',texto:'Ventas'},{valor:'it',texto:'Informática'},{valor:'admin',texto:'Administración'}]}),c('observaciones','TEXTO_MEDIO','Cliente de demostración',{ancho:'completo'})]},
 {titulo:'Producto',descripcion:'Catálogo, precios y existencias',campos:[c('referencia','CARACTER','PRD-001'),c('nombre','TEXTO_VARIABLE','Monitor 27 pulgadas'),c('precio','DECIMAL',199.99,{min:0,step:0.01}),c('stock','ENTERO_PEQUENO',45),c('peso','REAL',3.7),c('url','DIRECCION_WEB','https://ejemplo.com/producto'),c('color','COLOR','#4f46e5'),c('descuento','RANGO',20,{min:0,max:100}),c('categorias','CONJUNTO',['informatica','oficina'],{opciones:['informatica','oficina','accesorios']}),c('descripcion','TEXTO_LARGO','Descripción extensa del producto',{ancho:'completo'}),c('imagen','BINARIO','')]},
 {titulo:'Tipos del motor',descripcion:'Galería de los 36 tipos disponibles',campos:[c('texto','TEXTO','Ejemplo'),c('entero','ENTERO',42),c('real','REAL',3.14),c('booleano','BOOLEANO',true),c('fecha','FECHA','2026-11-05'),c('decimal','DECIMAL',19.99),c('entero_muy_pequeno','ENTERO_MUY_PEQUENO',12),c('entero_pequeno','ENTERO_PEQUENO',320),c('entero_mediano','ENTERO_MEDIANO',45000),c('entero_grande','ENTERO_GRANDE','900000000000'),c('real_doble','REAL_DOBLE',3.14159265),c('bit','BIT',true),c('caracter','CARACTER','A'),c('texto_variable','TEXTO_VARIABLE','Variable'),c('texto_corto','TEXTO_CORTO','Texto corto'),c('texto_medio','TEXTO_MEDIO','Texto medio'),c('texto_largo','TEXTO_LARGO','Texto largo'),c('hora','HORA','14:30'),c('fecha_hora','FECHA_HORA','2026-11-05T14:30'),c('marca_tiempo','MARCA_TIEMPO','2026-11-05T14:30'),c('anio','ANIO',2026),c('correo','CORREO','demo@ejemplo.com'),c('contrasena','CONTRASENA','demo123'),c('telefono','TELEFONO','600123456'),c('direccion_web','DIRECCION_WEB','https://ejemplo.com'),c('busqueda','BUSQUEDA','Consulta'),c('color','COLOR','#4f46e5'),c('rango','RANGO',65,{min:0,max:100}),c('enumeracion','ENUMERACION','b',{opciones:['a','b','c']}),c('conjunto','CONJUNTO',['a','c'],{opciones:['a','b','c']}),c('json','JSON','{"ejemplo":true}'),c('binario','BINARIO',''),c('binario_largo','BINARIO_LARGO',''),c('punto','PUNTO',{latitud:39.4699,longitud:-0.3763}),c('progreso','PROGRESO',72,{min:0,max:100}),c('medidor','MEDIDOR',0.65,{min:0,max:1})]}
];
class Formulario{
 constructor(json,selector){this.json=json;this.container=document.querySelector(selector);if(!this.container)throw Error('Contenedor no encontrado');this.controls=new Map()}
 generar(){this.container.replaceChildren();this.controls.clear();for(const campo of this.json.campos){const tipo=TYPE_MAP[campo.tipo];if(!tipo)throw Error('Tipo no soportado: '+campo.tipo);const group=document.createElement('div');group.className='field'+(campo.ancho==='completo'?' wide':'');const label=document.createElement('label');label.textContent=campo.titulo||campo.nombre;const id='campo_'+campo.nombre;label.htmlFor=id;group.append(label);let input;
 if(tipo==='select'){input=document.createElement('select');for(const opcion of campo.opciones||[]){const opt=document.createElement('option');opt.value=typeof opcion==='object'?opcion.valor:opcion;opt.textContent=typeof opcion==='object'?opcion.texto:opcion;input.append(opt)}input.value=campo.valor??''}
 else if(tipo==='textarea'){input=document.createElement('textarea');input.value=campo.valor??''}
 else if(tipo==='checkbox-group'){input=document.createElement('div');input.className='options';for(const opcion of campo.opciones||[]){const val=typeof opcion==='object'?opcion.valor:opcion;const title=typeof opcion==='object'?opcion.texto:opcion;const wrap=document.createElement('label');wrap.className='checkline';const check=document.createElement('input');check.type='checkbox';check.value=val;check.name=campo.nombre+'[]';check.checked=(campo.valor||[]).includes(val);wrap.append(check,document.createTextNode(title));input.append(wrap)}}
 else if(tipo==='point'){input=document.createElement('div');input.className='coords';for(const axis of ['latitud','longitud']){const n=document.createElement('input');n.type='number';n.step='any';n.placeholder=axis;n.setAttribute('aria-label',axis);n.value=campo.valor?.[axis]??'';input.append(n)}}
 else if(tipo==='progress'||tipo==='meter'){input=document.createElement(tipo);input.min=campo.min??0;input.max=campo.max??100;input.value=campo.valor??0;input.style.width='100%';const note=document.createElement('span');note.className='help';note.textContent='Visualización: no es un campo editable';group.append(input,note);this.container.append(group);this.controls.set(campo.nombre,{tipo,element:input});continue}
 else{input=document.createElement('input');input.type=tipo;if(tipo==='checkbox'){input.checked=Boolean(campo.valor)}else if(tipo!=='file'){input.value=campo.valor??''}}
 if(!['point','checkbox-group'].includes(tipo)){input.id=id;input.name=campo.nombre;input.required=Boolean(campo.requerido);if(campo.placeholder)input.placeholder=campo.placeholder;if(campo.min!==undefined)input.min=campo.min;if(campo.max!==undefined)input.max=campo.max;if(campo.step!==undefined)input.step=campo.step;else if(tipo==='number')input.step=['ENTERO','ENTERO_MUY_PEQUENO','ENTERO_PEQUENO','ENTERO_MEDIANO','ENTERO_GRANDE','ANIO'].includes(campo.tipo)?'1':'any';if(tipo==='file')input.accept=campo.accept||'';if(tipo==='checkbox')input.style.width='auto'}
 if(tipo==='checkbox'){const wrap=document.createElement('div');wrap.className='checkline';wrap.append(input,document.createTextNode('Sí / activo'));group.append(wrap)}else group.append(input);const note=document.createElement('span');note.className='help';note.textContent=campo.tipo;group.append(note);this.container.append(group);this.controls.set(campo.nombre,{tipo,element:input})}return this}
 valores(){const out={};for(const campo of this.json.campos){const {tipo,element}=this.controls.get(campo.nombre);if(tipo==='checkbox')out[campo.nombre]=element.checked;else if(tipo==='checkbox-group')out[campo.nombre]=[...element.querySelectorAll('input:checked')].map(x=>x.value);else if(tipo==='point'){const [lat,long]=element.querySelectorAll('input');out[campo.nombre]={latitud:lat.value===''?null:Number(lat.value),longitud:long.value===''?null:Number(long.value)}}else if(tipo==='file')out[campo.nombre]=[...element.files].map(f=>({nombre:f.name,tamano:f.size}));else if(tipo==='progress'||tipo==='meter')out[campo.nombre]=Number(element.value);else if(tipo==='number'||tipo==='range')out[campo.nombre]=element.value===''?null:Number(element.value);else out[campo.nombre]=element.value}return out}
}
let active=0,tab='schema',instance;const nav=document.querySelector('#navigation'),output=document.querySelector('#output'),notice=document.querySelector('#notice');document.querySelector('#typecount').textContent=Object.keys(TYPE_MAP).length+' tipos definidos';
function render(){nav.replaceChildren();DEMOS.forEach((demo,i)=>{const b=document.createElement('button');b.className='navbutton'+(i===active?' active':'');b.textContent=demo.titulo;b.onclick=()=>{active=i;notice.classList.remove('visible');render()};nav.append(b)});const demo=DEMOS[active];document.querySelector('#formtitle').textContent=demo.titulo;document.querySelector('#formdesc').textContent=demo.descripcion;instance=new Formulario(demo,'#fields').generar();update()}
function update(){output.textContent=JSON.stringify(tab==='schema'?DEMOS[active]:tab==='values'?instance.valores():TYPE_MAP,null,2)}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));update()});document.querySelector('#generated').addEventListener('input',update);document.querySelector('#generated').addEventListener('change',update);document.querySelector('#generated').addEventListener('submit',e=>{e.preventDefault();tab='values';document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));update();notice.textContent='Datos recogidos correctamente. Simulación local: no se han enviado ni guardado.';notice.classList.add('visible')});document.querySelector('#generated').addEventListener('reset',()=>{setTimeout(()=>{instance=new Formulario(DEMOS[active],'#fields').generar();update();notice.classList.remove('visible')},0)});document.querySelector('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(output.textContent);document.querySelector('#copy').textContent='Copiado';setTimeout(()=>document.querySelector('#copy').textContent='Copiar',1300)}catch{const selection=window.getSelection();const range=document.createRange();range.selectNodeContents(output);selection.removeAllRanges();selection.addRange(range)}};render();
</script></body></html>
