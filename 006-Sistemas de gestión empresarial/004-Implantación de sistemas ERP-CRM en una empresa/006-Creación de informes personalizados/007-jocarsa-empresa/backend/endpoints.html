<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>API endpoints · Crimson ERP</title><style>
:root{--base:#8b4513;--bg:#f4f1ed;--panel:#fff;--border:#ddd3c9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#29221d;font:15px Ubuntu,system-ui,sans-serif}header{background:var(--base);color:white;padding:20px 28px}header h1{margin:0;font-size:23px}main{display:grid;grid-template-columns:minmax(250px,320px) minmax(0,1fr);gap:16px;padding:20px;max-width:1350px;margin:auto}.panel{background:var(--panel);padding:22px;clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,16px 100%,0 calc(100% - 16px));border:1px solid var(--border)}h2{font-size:18px;margin:0 0 18px}label{display:block;font-weight:600;margin:13px 0 6px}input[type=text],select{width:100%;padding:10px;border:1px solid #c7b8a8;border-radius:4px;font:inherit}button{background:var(--base);color:white;border:0;padding:10px 14px;cursor:pointer;margin:6px 6px 6px 0}button.secondary{background:#655b52}button.danger{background:#9d3030}button:disabled{opacity:.4}#items button{display:block;width:100%;text-align:left;background:#f1e8df;color:#382a21;margin:4px 0}#items button.active{background:var(--base);color:white}.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:7px}.checks label{font-weight:400;margin:0}.secret{background:#f6f0e8;padding:12px;overflow-wrap:anywhere}#message{min-height:25px;color:#80410c}small{color:#625950}@media(max-width:750px){main{grid-template-columns:1fr}}
</style></head><body><header><h1>jocarsa | crimson · API endpoints</h1></header><main><section class="panel"><h2>Endpoints publicados</h2><button id="new">+ Nuevo endpoint</button><div id="items"></div></section><section class="panel"><h2>Configuración</h2><p id="message" role="status"></p><label for="entity">Entidad</label><select id="entity"></select><label for="route">Ruta pública</label><input id="route" type="text" placeholder="clientes" pattern="[a-z][a-z0-9-]*"><label><input id="enabled" type="checkbox"> Endpoint activo</label><h2>Campos compartidos</h2><div id="fields" class="checks"></div><h2 style="margin-top:20px">Métodos permitidos</h2><div id="methods" class="checks"></div><p><small>Los campos personalizados solo admiten lectura. Las operaciones de escritura aceptan exclusivamente campos físicos de la entidad.</small></p><button id="save">Guardar</button><button id="rotate" class="secondary">Regenerar clave</button><button id="remove" class="danger">Eliminar</button><div id="keybox" hidden><h2>Clave API (cópiala ahora)</h2><p class="secret" id="key"></p><button id="copy" class="secondary">Copiar clave</button></div><h2 style="margin-top:22px">URL de consulta</h2><p class="secret" id="url"></p></section></main><script>
const api='api/endpoints.php',q=s=>document.querySelector(s);let entities={},items=[],current=null,secret='';
async function call(action,body){const r=await fetch(api+'?action='+action,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined,credentials:'same-origin'});const x=await r.json();if(!r.ok)throw Error(x.error||'Error HTTP '+r.status);return x}
function msg(s){q('#message').textContent=s}function checkboxes(target,values,selected){q(target).replaceChildren();values.forEach(v=>{const label=document.createElement('label'),input=document.createElement('input');input.type='checkbox';input.value=v;input.checked=selected.includes(v);label.append(input,document.createTextNode(' '+v));q(target).append(label)})}
function chosen(target){return [...q(target).querySelectorAll('input:checked')].map(x=>x.value)}
function keyShow(s){secret=s;q('#key').textContent=s;q('#keybox').hidden=!s}
function render(){q('#items').replaceChildren();items.forEach(it=>{let b=document.createElement('button');b.textContent=(it.activo==='1'?'● ':'○ ')+it.ruta+' · '+it.entidad;b.className=current&&Number(current.Identificador)===Number(it.Identificador)?'active':'';b.onclick=()=>select(it);q('#items').append(b)})}
function updateUrl(){q('#url').textContent=new URL('api/public.php?ruta='+encodeURIComponent(q('#route').value),location.href).href}
function select(it){current=it;keyShow('');q('#entity').value=it?.entidad||Object.keys(entities)[0]||'';q('#route').value=it?.ruta||'';q('#enabled').checked=it?String(it.activo)==='1':false;checkboxes('#fields',entities[q('#entity').value]||[],it?.campos||[]);checkboxes('#methods',['GET','POST','PATCH','DELETE'],it?.metodos||['GET']);q('#rotate').disabled=!it;q('#remove').disabled=!it;render();updateUrl()}
async function reload(){const [a,b]=await Promise.all([call('entities'),call('list')]);entities=a.entities;items=b.items;q('#entity').replaceChildren();Object.keys(entities).forEach(t=>{const o=document.createElement('option');o.value=t;o.textContent=t;q('#entity').append(o)});select(items.find(x=>current&&x.Identificador===current.Identificador)||null)}
q('#new').onclick=()=>select(null);q('#entity').onchange=()=>checkboxes('#fields',entities[q('#entity').value]||[],[]);q('#route').oninput=updateUrl;
q('#save').onclick=async()=>{try{const d={id:current?.Identificador||0,entidad:q('#entity').value,ruta:q('#route').value.trim(),activo:q('#enabled').checked,campos:chosen('#fields'),metodos:chosen('#methods')};const r=await call('save',d);await reload();select(items.find(x=>Number(x.Identificador)===Number(r.id)));if(r.api_key)keyShow(r.api_key);msg('Configuración guardada')}catch(e){msg(e.message)}};
q('#rotate').onclick=async()=>{if(!current||!confirm('La clave anterior dejará de funcionar. ¿Continuar?'))return;try{const r=await call('rotate',{id:current.Identificador});keyShow(r.api_key);msg('Clave regenerada')}catch(e){msg(e.message)}};
q('#remove').onclick=async()=>{if(!current||!confirm('¿Eliminar este endpoint?'))return;try{await call('delete',{id:current.Identificador});current=null;await reload();msg('Endpoint eliminado')}catch(e){msg(e.message)}};
q('#copy').onclick=()=>navigator.clipboard.writeText(secret).then(()=>msg('Clave copiada')).catch(()=>msg('No se pudo copiar'));
reload().catch(e=>msg(e.message));
</script></body></html>
