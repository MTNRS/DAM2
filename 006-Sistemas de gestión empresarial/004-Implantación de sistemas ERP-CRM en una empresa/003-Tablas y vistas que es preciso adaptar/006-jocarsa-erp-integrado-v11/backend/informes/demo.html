<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crimson · Informe de demostración</title><link rel="stylesheet" href="../nucleo/reporting/reporting.css"><style>body{background:#ddd;margin:0}.jr-report{max-width:1050px;margin:24px auto;background:white;padding:30px;box-shadow:0 2px 16px #bbb} .jr-report section{border-bottom:1px solid #ddd;padding-bottom:20px}</style><link rel="stylesheet" href="../nucleo/graficas/graficas.css"></head><body><main class="jr-report"><button class="jr-print" onclick="window.print()">Imprimir / PDF</button><h1>Crimson · Informe de demostración</h1><p>Componentes reutilizables del núcleo · Datos ficticios</p><section><h2>1. Tabla de clientes</h2><div id="clientes"></div></section><section><h2>2. Grid de cards</h2><div id="cards"></div></section><section><h2>3. Vista de árbol</h2><div id="arbol"></div></section><section><h2>4. Selector de vistas</h2><div id="alternar"></div></section><section><h2>5. Calendario mensual</h2><div id="mensual" data-type="mensual"></div></section><section><h2>3. Calendario semanal</h2><div id="semanal" data-type="semanal"></div></section><section><h2>4. Horario diario</h2><div id="diario" data-type="diario"></div></section><section><h2>5. Calendario anual</h2><div id="anual" data-type="anual"></div></section><section><h2>Gráficas SVG reutilizables · seis tipos</h2><div id="graficas-demo"></div></section></main><script src="../nucleo/graficas/graficas.js"></script><script src="../nucleo/componentes/crud-vistas.js"></script><script src="../nucleo/reporting/reporting.js"></script><script>const R=JocarsaReporting;R.dataTable(document.getElementById('clientes'),{columns:[{key:'nombre',label:'Nombre'},{key:'ciudad',label:'Ciudad'},{key:'importe',label:'Importe'}],rows:Array.from({length:20},(_,i)=>({nombre:['María','Carlos','Lucía','David','Ana'][i%5]+' '+(i+1),ciudad:['Valencia','Madrid','Alicante'][i%3],importe:(i+1)*125})),pageSize:20});const items=[{Identificador:1,nombre:'Dirección',parent_id:null,ciudad:'Valencia'},{Identificador:2,nombre:'Ventas',parent_id:1,ciudad:'Madrid'},{Identificador:3,nombre:'Marketing',parent_id:1,ciudad:'Alicante'},{Identificador:4,nombre:'Comercial',parent_id:2,ciudad:'Valencia'}];const cols=[{key:'nombre',label:'Nombre'},{key:'ciudad',label:'Ciudad'}];R.cards(document.getElementById('cards'),{rows:items,columns:cols});R.tree(document.getElementById('arbol'),{rows:items});R.switcher(document.getElementById('alternar'),{rows:items,columns:cols});['mensual','semanal','diario','anual'].forEach(type=>R.calendar(document.getElementById(type),{type,date:new Date(2026,9,8)}));const gd=[{nombre:"Enero",valor:40},{nombre:"Febrero",valor:65},{nombre:"Marzo",valor:85},{nombre:"Abril",valor:55},{nombre:"Mayo",valor:95}];JocarsaGraficas.grid(document.getElementById("graficas-demo"),JocarsaGraficas.types.map(tipo=>({tipo,titulo:"Demostración · "+tipo,datos:gd,unidad:"unidades"})));</script></body></html>
