<script>
(function(){
 const u=window.CRIMSON_USER;
 if(u){
   document.querySelector("#usuarioActual").textContent=u.nombre;
   if(u.rol==="admin"){
     ["usuariosAdmin","modeloAdmin","opcionesAdmin"].forEach(id=>document.querySelector("#"+id).style.display="inline-flex");
   }
 }
 document.querySelector("#salir").onclick=async e=>{e.preventDefault();await fetch("api/auth.php?action=logout",{cache:"no-store"});location.href="login.php"};
})();
</script>
