
<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Demo SVG</title>
</head>
<body>

    <h1>Mi primer SVG</h1>

    <svg width="400" height="220">

        <!-- Rectángulo -->
        <rect x="20" y="20"
              width="110" height="75"
              fill="tomato" />

        <!-- Círculo -->
        <circle cx="205" cy="58"
                r="38"
                fill="cornflowerblue" />

        <!-- Elipse -->
        <ellipse cx="330" cy="58"
                 rx="52" ry="30"
                 fill="lightgreen" />

        <!-- Línea -->
        <line x1="30" y1="135"
              x2="370" y2="135"
              stroke="orange"
              stroke-width="5" />

        <!-- Triángulo -->
        <polygon points="200,150 155,205 245,205"
                 fill="mediumpurple" />

        <!-- Texto -->
        <text x="200" y="120"
              text-anchor="middle"
              font-size="16">
            Hola SVG
        </text>

    </svg>

</body>
</html>
