
<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gráfico de barras SVG</title>
</head>
<body>

<h1>Ventas mensuales</h1>

<svg width="500" height="300" viewBox="0 0 500 300">

    <!-- Ejes -->
    <line x1="50" y1="250" x2="470" y2="250"
          stroke="black" stroke-width="2"/>

    <line x1="50" y1="20" x2="50" y2="250"
          stroke="black" stroke-width="2"/>

    <!-- Barras -->
    <rect x="80" y="170" width="50" height="80"
          fill="steelblue"/>

    <rect x="160" y="120" width="50" height="130"
          fill="seagreen"/>

    <rect x="240" y="80" width="50" height="170"
          fill="orange"/>

    <rect x="320" y="140" width="50" height="110"
          fill="mediumpurple"/>

    <rect x="400" y="60" width="50" height="190"
          fill="tomato"/>

    <!-- Valores -->
    <text x="105" y="160" text-anchor="middle">40</text>
    <text x="185" y="110" text-anchor="middle">65</text>
    <text x="265" y="70" text-anchor="middle">85</text>
    <text x="345" y="130" text-anchor="middle">55</text>
    <text x="425" y="50" text-anchor="middle">95</text>

    <!-- Etiquetas -->
    <text x="105" y="270" text-anchor="middle">Ene</text>
    <text x="185" y="270" text-anchor="middle">Feb</text>
    <text x="265" y="270" text-anchor="middle">Mar</text>
    <text x="345" y="270" text-anchor="middle">Abr</text>
    <text x="425" y="270" text-anchor="middle">May</text>

</svg>

</body>
</html>
