<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calendario anual · meses y semanas</title><style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:18px;color:#20332e;background:#fafcfb}header{display:flex;align-items:center;gap:12px;background:#f0f6f3;border-left:4px solid #237653;padding:12px;flex-wrap:wrap}h2{font-size:18px;margin:0 auto 0 0}button{padding:7px 12px;border:1px solid #b8cfc5;border-radius:4px;background:white;cursor:pointer}button:hover{background:#e4f3ec}.wrap{overflow:auto;max-height:82vh;margin-top:12px}table{border-collapse:collapse;width:100%;table-layout:fixed;background:white}th,td{border:1px solid #d5e5df;text-align:center;padding:6px;font-size:12px}th{background:#f3f8f5}td{cursor:pointer}td:hover{background:#c8e8d9}.today{background:#bce5d2!important}.selected{background:#278b67!important;color:white}.weekend{background:#f0f3f2}.outside{color:#a8b9b2;background:#f7faf8}.note{font-size:12px;color:#567067;margin-top:12px}.wrap{max-height:85vh}table{width:max-content;min-width:100%;table-layout:fixed}th,td{min-width:37px;padding:6px 3px;font-size:11px;height:30px}.label{min-width:105px;position:sticky;left:0;z-index:3;background:#f3f8f5;text-align:left;padding-left:8px}.month-head{background:#dceee5;color:#145a41;white-space:nowrap;font-size:10px}.split-month{background:linear-gradient(135deg,#dceee5 49%,#237653 50%,#edf5ef 51%)}.week-head{position:sticky;top:30px;z-index:2;background:#f3f8f5}.month-left{border-left:3px solid #237653!important}.month-top{border-top:3px solid #237653!important}.first-day{font-weight:bold;color:#145a41}.outside{opacity:.42}thead tr:first-child th{position:sticky;top:0;z-index:4;height:30px}</style></head><body><header><h2>Calendario anual · meses y semanas</h2><button id="prev">◀</button><button id="now">Hoy</button><button id="next">▶</button><strong id="period"></strong></header><div class="wrap"><table id="calendar"></table></div><p class="note">Pulsa una fecha para seleccionarla. La fecha actual aparece en verde claro.</p><script>const t=document.getElementById('calendar'),period=document.getElementById('period');let date=new Date(),selected=null;const days=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'],months=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const today=iso(new Date());function make(tag,txt,cls=''){const e=document.createElement(tag);e.textContent=txt;e.className=cls;return e}function addDate(d,cls=''){const key=iso(d),c=make('td',d.getDate(),cls);c.title=d.toLocaleDateString('es-ES',{dateStyle:'full'});if(key===today)c.classList.add('today');if(key===selected)c.classList.add('selected');c.onclick=()=>{selected=key;render()};return c}document.getElementById('now').onclick=()=>{date=new Date();render()};function weekStart(y){let d=new Date(y,0,4);d.setDate(d.getDate()-(d.getDay()+6)%7);return d}function render(){t.innerHTML='';let y=date.getFullYear(),start=weekStart(y),end=weekStart(y+1),weeks=Math.round((end-start)/604800000);period.textContent='Año '+y+' · '+weeks+' semanas ISO';const h=t.createTHead(),mr=h.insertRow(),wr=h.insertRow();let corner=make('th','Día / Mes','label');corner.rowSpan=2;mr.appendChild(corner);for(let w=0;w<weeks;w++){let mon=new Date(start);mon.setDate(mon.getDate()+w*7);let sun=new Date(mon);sun.setDate(mon.getDate()+6);let names=[];for(let k=0;k<7;k++){let d=new Date(mon);d.setDate(mon.getDate()+k);if(d.getFullYear()===y&&!names.includes(d.getMonth()))names.push(d.getMonth())}let th=make('th',names.length===2?months[names[0]].slice(0,3)+' / '+months[names[1]].slice(0,3):names.length?months[names[0]].slice(0,3):'','month-head'+(names.length===2?' split-month':''));th.title=names.map(n=>months[n]).join(' → ');mr.appendChild(th);wr.appendChild(make('th',String(w+1),'week-head'))}const body=t.createTBody();for(let day=0;day<7;day++){const tr=body.insertRow();tr.appendChild(make('th',days[day],'label'));for(let w=0;w<weeks;w++){let d=new Date(start);d.setDate(d.getDate()+w*7+day);let c=addDate(d,(day>4?'weekend ':'')+(d.getFullYear()!==y?'outside ':''));let prev=new Date(d);prev.setDate(prev.getDate()-1);let above=new Date(d);above.setDate(above.getDate()-7);if(d.getMonth()!==above.getMonth())c.classList.add('month-left');if(day>0&&d.getMonth()!==prev.getMonth())c.classList.add('month-top');if(d.getDate()===1)c.classList.add('first-day');c.title=d.toLocaleDateString('es-ES',{dateStyle:'full'});tr.appendChild(c)}}}document.getElementById('prev').onclick=()=>{date.setFullYear(date.getFullYear()-1);render()};document.getElementById('next').onclick=()=>{date.setFullYear(date.getFullYear()+1);render()};render();</script></body></html>
