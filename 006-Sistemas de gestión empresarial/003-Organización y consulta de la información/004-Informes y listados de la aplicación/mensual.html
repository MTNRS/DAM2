<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calendario mensual</title><style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:18px;color:#20332e;background:#fafcfb}header{display:flex;align-items:center;gap:12px;background:#f0f6f3;border-left:4px solid #237653;padding:12px;flex-wrap:wrap}h2{font-size:18px;margin:0 auto 0 0}button{padding:7px 12px;border:1px solid #b8cfc5;border-radius:4px;background:white;cursor:pointer}button:hover{background:#e4f3ec}.wrap{overflow:auto;max-height:82vh;margin-top:12px}table{border-collapse:collapse;width:100%;table-layout:fixed;background:white}th,td{border:1px solid #d5e5df;text-align:center;padding:6px;font-size:12px}th{background:#f3f8f5}td{cursor:pointer;height:105px;vertical-align:top;text-align:left;font-size:16px;padding:12px}td:hover{background:#c8e8d9}.today{background:#bce5d2!important}.selected{background:#278b67!important;color:white}.weekend{background:#f0f3f2}.outside{color:#a8b9b2;background:#f7faf8}.note{font-size:12px;color:#567067;margin-top:12px}</style></head><body><header><h2>Calendario mensual</h2><button id="prev">◀</button><button id="now">Hoy</button><button id="next">▶</button><strong id="period"></strong></header><div class="wrap"><table id="calendar"></table></div><p class="note">Pulsa una fecha para seleccionarla. La fecha actual aparece en verde claro.</p><script>const t=document.getElementById('calendar'),period=document.getElementById('period');let date=new Date(),selected=null;const days=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'],months=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const today=iso(new Date());function make(tag,txt,cls=''){const e=document.createElement(tag);e.textContent=txt;e.className=cls;return e}function addDate(d,cls=''){const key=iso(d),c=make('td',d.getDate(),cls);c.title=d.toLocaleDateString('es-ES',{dateStyle:'full'});if(key===today)c.classList.add('today');if(key===selected)c.classList.add('selected');c.onclick=()=>{selected=key;render()};return c}document.getElementById('now').onclick=()=>{date=new Date();render()};function render(){t.innerHTML='';const y=date.getFullYear(),m=date.getMonth();period.textContent=months[m]+' '+y;const thead=t.createTHead(),r=thead.insertRow();for(const d of days)r.appendChild(make('th',d));const start=new Date(y,m,1),offset=(start.getDay()+6)%7,last=new Date(y,m+1,0).getDate(),count=Math.ceil((offset+last)/7),tbody=t.createTBody();for(let w=0;w<count;w++){const tr=tbody.insertRow();for(let k=0;k<7;k++){const d=new Date(y,m,1+w*7+k-offset);tr.appendChild(addDate(d,(d.getMonth()!==m?'outside ':'')+(k>4?'weekend':'')))}}}document.getElementById('prev').onclick=()=>{date.setDate(1);date.setMonth(date.getMonth()-1);render()};document.getElementById('next').onclick=()=>{date.setDate(1);date.setMonth(date.getMonth()+1);render()};render();</script></body></html>
