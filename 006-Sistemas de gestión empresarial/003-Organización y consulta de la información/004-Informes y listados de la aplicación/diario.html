<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Horario diario</title><style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:18px;color:#20332e;background:#fafcfb}header{display:flex;align-items:center;gap:12px;background:#f0f6f3;border-left:4px solid #237653;padding:12px;flex-wrap:wrap}h2{font-size:18px;margin:0 auto 0 0}button,input{padding:7px;border:1px solid #b8cfc5;border-radius:4px;background:white;cursor:pointer}button:hover{background:#e4f3ec}.wrap{overflow:auto;max-height:80vh}table{border-collapse:collapse;width:100%;table-layout:fixed;background:white}th,td{border:1px solid #d5e5df;text-align:center;padding:5px;font-size:11px;min-width:28px}th{background:#f3f8f5;position:sticky;top:0;z-index:2}td{height:27px;cursor:pointer}td:hover{background:#c8e8d9}.today{background:#bce5d2!important}.selected{background:#278b67!important;color:white}.weekend{background:#f0f3f2}.label{min-width:110px;text-align:left;font-weight:bold;position:sticky;left:0;background:#fff;z-index:1}.note{font-size:12px;color:#567067;margin-top:12px}</style></head><body><header><h2>Horario diario</h2><button id="prev">◀</button><button id="now">Hoy</button><button id="next">▶</button><strong id="period"></strong></header><div class="wrap"><table id="calendar"></table></div><p class="note">Haz clic en una celda para seleccionarla. Las fechas actuales se muestran en verde claro.</p><script>const t=document.getElementById('calendar'),period=document.getElementById('period');let date=new Date(),selected=null;const days=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];const fmt=d=>d.toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit',year:'numeric'});const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const today=iso(new Date());function cell(tag,text,cls='',key=''){let e=document.createElement(tag);e.textContent=text;e.className=cls;if(key){e.dataset.key=key;if(key===today)e.classList.add('today');if(key===selected)e.classList.add('selected');e.onclick=()=>{selected=key;render()}}return e}function row(...cells){let r=t.insertRow();cells.forEach(c=>r.appendChild(c));return r}function head(labels){let r=t.createTHead().insertRow();labels.forEach(x=>r.appendChild(cell('th',x)))}document.getElementById('now').onclick=()=>{date=new Date();render()};function render(){t.innerHTML='';period.textContent=date.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long',year:'numeric'});head(['Hora','Actividad / anotaciones']);let b=t.createTBody();for(let h=0;h<24;h++)for(let min of [0,30]){let r=b.insertRow();r.appendChild(cell('th',`${String(h).padStart(2,'0')}:${String(min).padStart(2,'0')}`,'label'));r.appendChild(cell('td','', '',iso(date)+' '+h+':'+min))}}document.getElementById('prev').onclick=()=>{date.setDate(date.getDate()-1);render()};document.getElementById('next').onclick=()=>{date.setDate(date.getDate()+1);render()};render();</script></body></html>
