
<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vida artificial - Evolución genética</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 20px;
    background: #eee;
    font-family: Arial, sans-serif;
    color: #222;
  }

  h2 { margin: 0 0 12px; }

  .barra-acciones { display:flex; align-items:center; gap:12px; margin:0 0 14px; flex-wrap:wrap; }
  #guardar { background:#2563eb; color:white; border:0; padding:10px 18px; border-radius:6px; cursor:pointer; font-weight:bold; }
  #guardar:disabled { opacity:.6; cursor:wait; }
  #estadoGuardado { font-size:13px; }
  #estadisticas {
    margin-bottom: 15px;
    padding: 12px;
    background: white;
    border: 1px solid #ddd;
    font-size: 13px;
    line-height: 1.7;
  }

  .layout {
    display: grid;
    grid-template-columns: 800px minmax(300px, 1fr);
    gap: 16px;
    align-items: start;
  }

  #escenario {
    background: white;
    border: 1px solid #ccc;
    width: 100%;
    height: auto;
    display: block;
  }

  .panel {
    display: flex;
    flex-direction: column;
    gap: 15px;
    min-width: 0;
  }

  .grafica {
    background: white;
    border: 1px solid #ddd;
    padding: 14px;
  }

  .grafica h3 {
    margin: 0 0 12px;
    font-size: 15px;
  }

  .grafica canvas {
    display: block;
    width: 100%;
    height: 240px;
  }

  @media(max-width: 1150px) {
    .layout {
      grid-template-columns: 1fr;
    }
  }
  .reloj-panel{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid #ddd;padding:12px;margin-bottom:12px;font-size:13px}
  #horaActual{font-weight:bold;font-size:19px;font-variant-numeric:tabular-nums;min-width:60px}
  .reloj-pista{flex:1;height:13px;border-radius:20px;overflow:hidden;background:linear-gradient(to right,#14213d 0%,#f9d976 29%,#f5bd55 79%,#182443 88%,#14213d 100%)}
  #barraDia{height:100%;width:0%;border-right:4px solid #ef4444;box-shadow:0 0 3px #111}
  #estadoDia{min-width:140px;text-align:right}
</style>
</head>
<body>

<h2>Simulación de evolución genética</h2>

<div class="barra-acciones"><button id="guardar" type="button">Guardar personas</button><span id="estadoGuardado" role="status" aria-live="polite"></span></div>
<div class="reloj-panel"><span id="horaActual">07:00</span><div class="reloj-pista"><div id="barraDia"></div></div><span id="estadoDia">Día</span></div>
<div id="estadisticas"></div>

<div class="layout">

  <canvas id="escenario" width="800" height="700"></canvas>

  <div class="panel">

    <div class="grafica">
      <h3>Evolución histórica de la población</h3>
      <canvas id="graficaPoblacion"></canvas>
    </div>

    <div class="grafica">
      <h3>Edades de los individuos vivos</h3>
      <canvas id="graficaEdades"></canvas>
    </div>

  </div>

</div>

<script>

// =====================================
// CONFIGURACIÓN GLOBAL
// =====================================

const CONFIG = {

  anchura: 800,
  altura: 700,

  poblacionInicial: 120,
  maxComidas: 100,
  maxPoblacion: 500,
  numeroWorkers: Math.max(1, Math.min(8, (navigator.hardwareConcurrency || 4) - 1)),

  edadReproduccion: 20,
  variacionReproduccion: 5,

  edadMuerte: 30,
  variacionMuerte: 10,

  minDescendientes: 0,
  maxDescendientes: 3,

  fotogramasPorAno: 60,
  tiempoCadaver: 3000,

  probabilidadMutacion: 0.25,

  // METABOLISMO
  perdidaEnergiaPorFotograma: 0.00005,
  aumentoHambrePorFotograma: 0.00008,
  reduccionHambrePorComida: 0.20,

  // Consumo adicional según el hambre
  consumoEnergiaPorHambre: 0.00008,

  // GRÁFICAS
  intervaloHistorial: 30,
  maxPuntosHistorial: 500,
  intervaloGraficas: 15,

  // CICLO DIARIO: 2160 fotogramas equivalen a 24 horas (3 veces más lento)
  fotogramasPorDia: 2160,
  horaInicio: 7,
  horaNoche: 21,
  horaAmanecer: 7,
  // El animal empieza a regresar antes de que oscurezca
  horaRegreso: 19,
  velocidadRegreso: 2.2,
  radioDormir: 18,
  // Cortejo y desplazamiento
  distanciaPareja: 15,
  pesoBuscarPareja: 0.60,
  inicioAtardecer: 17,
  giroMaximoPorFotograma: 0.055,
  // Núcleo cuadrado de 10x10 (radio=5)
  margenColision: 0.15,
  aumentoHambreDormidoPorFotograma: 0.00012,
  recuperacionEnergiaDormidoPorFotograma: 0.00006
};

const DOS_PI = Math.PI * 2;
const MADRIGUERAS = Array.from({length:10}, (_,i)=>({
  id:i, lado:i<5?'izquierda':'derecha',
  x:i<5?18:CONFIG.anchura-18,
  y:(i%5+1)*CONFIG.altura/6
}));
function madrigueraDe(id){return MADRIGUERAS[((Math.trunc(Number(id))||0)%10+10)%10];}
function horaSimulada(){return ((Number(CONFIG.horaInicio)||0)+fotogramas*24/Math.max(1,CONFIG.fotogramasPorDia))%24;}
function esNoche(h){return h>=CONFIG.horaNoche || h<CONFIG.horaAmanecer;}
function esRegreso(h){return h>=CONFIG.horaRegreso || h<CONFIG.horaAmanecer;}
function actualizarReloj(){
  const h=horaSimulada(), minutos=Math.floor(h*60+0.00001)%1440;
  document.querySelector('#horaActual').textContent=String(Math.floor(minutos/60)).padStart(2,'0')+':'+String(minutos%60).padStart(2,'0');
  document.querySelector('#barraDia').style.width=(h/24*100)+'%';
  const noche=esNoche(h);
  document.querySelector('#estadoDia').textContent=noche?'Noche · descanso':esRegreso(h)?'Atardecer · regreso':'Día · actividad';
}

const lienzo = document.querySelector("#escenario");
const contexto = lienzo.getContext("2d");

const estadisticas = document.querySelector("#estadisticas");

const canvasPoblacion = document.querySelector("#graficaPoblacion");
const canvasEdades = document.querySelector("#graficaEdades");

let personas = [];
let comidas = [];

let fotogramas = 0;
let siguienteId = 1;

let nacimientos = 0;
let muertes = 0;

let historialPoblacion = [];

// =====================================
// UTILIDADES
// =====================================

function aleatorio(min, max) {
  return min + Math.random() * (max - min);
}

function entero(min, max) {
  return Math.floor(aleatorio(min, max + 1));
}

function limitar(valor, min, max) {
  return Math.max(min, Math.min(max, valor));
}

function distancia(x1, y1, x2, y2) {
  return Math.hypot(x2 - x1, y2 - y1);
}

function mutar(valor, intensidad, min, max) {

  if (Math.random() < CONFIG.probabilidadMutacion) {
    valor += aleatorio(-intensidad, intensidad);
  }

  return limitar(valor, min, max);
}

// =====================================
// COMIDA
// =====================================

class Comida {

  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.radio = 4;
  }

  dibuja(ctx) {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radio, 0, DOS_PI);
    ctx.fillStyle = "#22aa22";
    ctx.fill();
  }
}

function crearComida() {

  return new Comida(
    aleatorio(20, CONFIG.anchura - 20),
    aleatorio(20, CONFIG.altura - 20)
  );
}

// =====================================
// GENÉTICA
// =====================================

function crearSensorAleatorio() {

  return {
    angulo: aleatorio(-Math.PI / 2, Math.PI / 2),
    longitud: aleatorio(30, 60),
    giroColision: aleatorio(-0.12, 0.12),
    giroComida: aleatorio(-0.12, 0.12)
  };
}

function crearGenomaAleatorio() {

  let sensores = [];

  let cantidad = entero(2, 5);

  for (let i = 0; i < cantidad; i++) {
    sensores.push(crearSensorAleatorio());
  }

  return {
    sensores: sensores,
    velocidad: aleatorio(0.7, 1.5),
    descendientes: entero(
      CONFIG.minDescendientes,
      CONFIG.maxDescendientes
    )
  };
}

function heredarGenoma(padre) {

  let sensores = padre.sensores.map(sensor => ({

    angulo: mutar(
      sensor.angulo,
      0.15,
      -Math.PI / 2,
      Math.PI / 2
    ),

    longitud: mutar(
      sensor.longitud,
      5,
      15,
      90
    ),

    giroColision: mutar(
      sensor.giroColision,
      0.025,
      -0.25,
      0.25
    ),

    giroComida: mutar(
      sensor.giroComida,
      0.025,
      -0.25,
      0.25
    )
  }));

  // Mutación en cantidad de sensores
  if (Math.random() < 0.05) {

    if (Math.random() < 0.5 && sensores.length < 5) {
      sensores.push(crearSensorAleatorio());
    }
    else if (sensores.length > 2) {
      sensores.splice(
        entero(0, sensores.length - 1),
        1
      );
    }
  }

  let descendientes = padre.descendientes;

  if (Math.random() < CONFIG.probabilidadMutacion) {
    descendientes += Math.random() < 0.5 ? -1 : 1;
  }

  descendientes = limitar(
    descendientes,
    CONFIG.minDescendientes,
    CONFIG.maxDescendientes
  );

  return {
    sensores: sensores,

    velocidad: mutar(
      padre.velocidad,
      0.15,
      0.3,
      2.5
    ),

    descendientes: descendientes
  };
}

// =====================================
// PERSONA
// =====================================

class Persona {

  constructor(x, y, genoma = null, generacion = 0) {

    this.id = siguienteId++;
    this.madrigueraId = entero(0, MADRIGUERAS.length-1);
    this.durmiendo = false;
    this.sexo = Math.random()<0.5 ? "chico" : "chica";
    this.parejaId = null;
    this.nombre = "Persona " + this.id;

    this.posx = x;
    this.posy = y;
    this.angulo = aleatorio(0, DOS_PI);

    this.radio = 5;

    this.hambre = aleatorio(0, 0.3);
    this.energia = aleatorio(0.7, 1);

    this.edad = 0;

    this.edadReproduccion = aleatorio(
      CONFIG.edadReproduccion - CONFIG.variacionReproduccion,
      CONFIG.edadReproduccion + CONFIG.variacionReproduccion
    );

    this.edadMuerte = aleatorio(
      CONFIG.edadMuerte - CONFIG.variacionMuerte,
      CONFIG.edadMuerte + CONFIG.variacionMuerte
    );

    this.generacion = generacion;
    this.reproducido = false;

    this.vivo = true;
    this.momentoMuerte = null;

    this.genoma = genoma || crearGenomaAleatorio();

    this.velocidad = this.genoma.velocidad;
    this.descendientes = this.genoma.descendientes;

    this.sensores = this.genoma.sensores.map(s => ({
      ...s,
      colision: false,
      comida: false
    }));
  }

  // =====================================
  // DETECCIÓN
  // =====================================

  detectar(personas, comidas) {

    for (let sensor of this.sensores) {

      sensor.colision = false;
      sensor.comida = false;

      let angulo = this.angulo + sensor.angulo;
      let dx = Math.cos(angulo);
      let dy = Math.sin(angulo);

      for (let d = 5; d <= sensor.longitud; d += 3) {

        let x = this.posx + dx * d;
        let y = this.posy + dy * d;

        // Bordes
        if (
          x < 0 || x > CONFIG.anchura ||
          y < 0 || y > CONFIG.altura
        ) {
          sensor.colision = true;
          break;
        }

        // Otros individuos
        for (let otra of personas) {

          if (otra === this || !otra.vivo) continue;

          if (
            distancia(x, y, otra.posx, otra.posy)
            < otra.radio
          ) {
            sensor.colision = true;
            break;
          }
        }

        if (sensor.colision) break;

        // Comida
        for (let alimento of comidas) {

          if (
            distancia(x, y, alimento.x, alimento.y)
            < alimento.radio + 2
          ) {
            sensor.comida = true;
            break;
          }
        }

        if (sensor.comida) break;
      }
    }
  }

  // =====================================
  // COMER
  // =====================================

  comer(comidas) {

    if (!this.vivo) return;

    for (let i = comidas.length - 1; i >= 0; i--) {

      let alimento = comidas[i];

      if (
        distancia(
          this.posx,
          this.posy,
          alimento.x,
          alimento.y
        ) < this.radio + alimento.radio
      ) {

        this.hambre = limitar(
          this.hambre - CONFIG.reduccionHambrePorComida,
          0,
          1
        );

        comidas.splice(i, 1);
      }
    }
  }

  // =====================================
  // REPRODUCCIÓN
  // =====================================

  reproducir(conPareja) {
    if (!this.vivo || !conPareja?.vivo || this.reproducido || conPareja.reproducido || this.sexo === conPareja.sexo) return [];
    this.reproducido = true;
    conPareja.reproducido = true;
    this.parejaId = conPareja.id;
    conPareja.parejaId = this.id;
    const hijos = [];
    // La cantidad la aporta la madre; cada hijo hereda una mezcla de ambos genomas.
    const madre = this.sexo === 'chica' ? this : conPareja;
    const padre = madre === this ? conPareja : this;
    for (let i=0;i<madre.descendientes;i++) {
      const genoma = heredarGenoma(Math.random()<0.5 ? madre.genoma : padre.genoma);
      const otro = Math.random()<0.5 ? madre.genoma : padre.genoma;
      genoma.velocidad = limitar((genoma.velocidad+otro.velocidad)/2,0.3,2.5);
      genoma.descendientes = Math.max(CONFIG.minDescendientes,Math.min(CONFIG.maxDescendientes,Math.round((madre.descendientes+padre.descendientes)/2 + entero(-1,1))));
      const hijo = new Persona(
        limitar((this.posx+conPareja.posx)/2+aleatorio(-15,15),10,CONFIG.anchura-10),
        limitar((this.posy+conPareja.posy)/2+aleatorio(-15,15),10,CONFIG.altura-10),
        genoma,Math.max(this.generacion,conPareja.generacion)+1
      );
      hijo.madrigueraId = madre.madrigueraId;
      hijos.push(hijo);
    }
    return hijos;
  }

  // =====================================
  // MUERTE
  // =====================================

  morir() {

    if (!this.vivo) return;

    this.vivo = false;
    this.energia = 0;
    this.momentoMuerte = performance.now();

    muertes++;
  }

  // =====================================
  // ACTUALIZACIÓN
  // =====================================

  actualiza(personas, comidas) {

    if (!this.vivo) return [];

    // Envejecer
    this.edad += 1 / CONFIG.fotogramasPorAno;

    // Muerte por vejez
    if (this.edad >= this.edadMuerte) {
      this.morir();
      return [];
    }

    this.detectar(personas, comidas);

    // Respuestas genéticas
    for (let sensor of this.sensores) {

      if (sensor.colision) {
        this.angulo += sensor.giroColision;
      }

      if (sensor.comida) {
        this.angulo += sensor.giroComida;
      }
    }

    // Movimiento
    this.posx += Math.cos(this.angulo) * this.velocidad;
    this.posy += Math.sin(this.angulo) * this.velocidad;

    this.posx = limitar(
      this.posx,
      this.radio,
      CONFIG.anchura - this.radio
    );

    this.posy = limitar(
      this.posy,
      this.radio,
      CONFIG.altura - this.radio
    );

    // =====================================
    // METABOLISMO GLOBAL
    // =====================================

    // Incremento del hambre por fotograma
    this.hambre = limitar(
      this.hambre + CONFIG.aumentoHambrePorFotograma,
      0,
      1
    );

    // Pérdida energética por fotograma
    let consumo =
      CONFIG.perdidaEnergiaPorFotograma +
      this.hambre * CONFIG.consumoEnergiaPorHambre;

    this.energia = limitar(
      this.energia - consumo,
      0,
      1
    );

    this.comer(comidas);

    // Muerte por agotamiento
    if (this.energia <= 0) {
      this.morir();
      return [];
    }

    // Reproducción
    if (
      this.edad >= this.edadReproduccion &&
      !this.reproducido
    ) {
      return this.reproducir();
    }

    return [];
  }

  // =====================================
  // DIBUJAR
  // =====================================

  dibuja(ctx) {

    if (!this.vivo) {
      ctx.fillStyle = "#999";
      ctx.fillRect(this.posx - 5, this.posy - 5, 10, 10);
      return;
    }

    // Sensores
    for (let sensor of this.sensores) {

      let angulo = this.angulo + sensor.angulo;

      ctx.beginPath();
      ctx.moveTo(this.posx, this.posy);

      ctx.lineTo(
        this.posx + Math.cos(angulo) * sensor.longitud,
        this.posy + Math.sin(angulo) * sensor.longitud
      );

      ctx.strokeStyle = sensor.colision
        ? "orange"
        : sensor.comida
          ? "limegreen"
          : "rgba(0,100,255,0.35)";

      ctx.lineWidth = 1;
      ctx.stroke();
    }

    // Energía
    ctx.beginPath();
    ctx.arc(
      this.posx,
      this.posy,
      12,
      -Math.PI / 2,
      -Math.PI / 2 + (Number.isFinite(Number(this.energia)) ? limitar(Number(this.energia),0,1) : 0) * DOS_PI
    );
    ctx.strokeStyle = "green";
    ctx.lineWidth = 3;
    ctx.stroke();

    // Hambre
    ctx.beginPath();
    ctx.arc(
      this.posx,
      this.posy,
      17,
      -Math.PI / 2,
      -Math.PI / 2 + (Number.isFinite(Number(this.hambre)) ? limitar(Number(this.hambre),0,1) : 0) * DOS_PI
    );
    ctx.strokeStyle = "red";
    ctx.lineWidth = 3;
    ctx.stroke();

    // Sexo: pequeño indicador sobre el núcleo.
    ctx.fillStyle = this.sexo === 'chica' ? '#d946a0' : '#2563eb';
    ctx.fillRect(this.posx - 5, this.posy - 8, 10, 3);

    // Cuerpo
    ctx.fillStyle = "black";
    ctx.fillRect(
      this.posx - 5,
      this.posy - 5,
      10,
      10
    );

    // Dirección
    let longitud = 30;

    let px = this.posx + Math.cos(this.angulo) * longitud;
    let py = this.posy + Math.sin(this.angulo) * longitud;

    ctx.strokeStyle = "black";
    ctx.lineWidth = 2;

    ctx.beginPath();
    ctx.moveTo(this.posx, this.posy);
    ctx.lineTo(px, py);
    ctx.stroke();

    // Punta de flecha
    let apertura = Math.PI / 6;
    let tamano = 8;

    ctx.beginPath();
    ctx.moveTo(px, py);
    ctx.lineTo(
      px - Math.cos(this.angulo - apertura) * tamano,
      py - Math.sin(this.angulo - apertura) * tamano
    );
    ctx.moveTo(px, py);
    ctx.lineTo(
      px - Math.cos(this.angulo + apertura) * tamano,
      py - Math.sin(this.angulo + apertura) * tamano
    );
    ctx.stroke();

    // Edad
    ctx.fillStyle = "#555";
    ctx.font = "10px Arial";
    ctx.textAlign = "center";
    ctx.fillText(
      Math.floor(this.edad),
      this.posx,
      this.posy - 23
    );
  }
}

// =====================================
// GRÁFICAS CANVAS
// =====================================

// Ajustar resolución interna a tamaño visible
function prepararGrafica(canvas) {

  const rect = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;

  canvas.width = Math.round(rect.width * dpr);
  canvas.height = Math.round(rect.height * dpr);

  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  return {
    ctx: ctx,
    ancho: rect.width,
    alto: rect.height
  };
}

function dibujarEjes(ctx, ancho, alto, margen) {

  ctx.strokeStyle = "#ddd";
  ctx.lineWidth = 1;

  ctx.beginPath();
  ctx.moveTo(margen, 10);
  ctx.lineTo(margen, alto - margen);
  ctx.lineTo(ancho - 10, alto - margen);
  ctx.stroke();
}

// =====================================
// GRÁFICA HISTÓRICA DE POBLACIÓN
// =====================================

function dibujarGraficaPoblacion() {

  let {ctx, ancho, alto} = prepararGrafica(canvasPoblacion);

  ctx.clearRect(0, 0, ancho, alto);

  const margen = 35;
  const derecha = 10;
  const arriba = 15;

  const areaAncho = ancho - margen - derecha;
  const areaAlto = alto - margen - arriba;

  dibujarEjes(ctx, ancho, alto, margen);

  if (historialPoblacion.length === 0) return;

  let maximo = Math.max(
    5,
    ...historialPoblacion.map(p => p.poblacion)
  );

  maximo = Math.ceil(maximo * 1.1);

  // Líneas horizontales
  ctx.font = "11px Arial";
  ctx.fillStyle = "#777";
  ctx.textAlign = "right";

  for (let i = 0; i <= 4; i++) {

    let valor = maximo * i / 4;
    let y = alto - margen - areaAlto * i / 4;

    ctx.strokeStyle = "#eee";
    ctx.beginPath();
    ctx.moveTo(margen, y);
    ctx.lineTo(ancho - derecha, y);
    ctx.stroke();

    ctx.fillText(
      Math.round(valor),
      margen - 5,
      y + 4
    );
  }

  // Línea de población
  ctx.beginPath();
  ctx.strokeStyle = "#2563eb";
  ctx.lineWidth = 2;

  let n = historialPoblacion.length;

  historialPoblacion.forEach((p, i) => {

    let x = margen +
      (n === 1 ? 0 : i / (n - 1)) * areaAncho;

    let y = alto - margen -
      (p.poblacion / maximo) * areaAlto;

    if (i === 0) {
      ctx.moveTo(x, y);
    } else {
      ctx.lineTo(x, y);
    }
  });

  ctx.stroke();

  // Etiquetas de tiempo
  ctx.fillStyle = "#777";
  ctx.textAlign = "left";

  ctx.fillText(
    historialPoblacion[0].tiempo.toFixed(0),
    margen,
    alto - 8
  );

  ctx.textAlign = "right";

  );

function dibujarGraficaEdades() {

  let {ctx, ancho, alto} = prepararGrafica(canvasEdades);

  ctx.clearRect(0, 0, ancho, alto);

  const margen = 35;
  const derecha = 10;
  const arriba = 15;

  const areaAncho = ancho - margen - derecha;
  const areaAlto = alto - margen - arriba;

  dibujarEjes(ctx, ancho, alto, margen);

  let vivos = personas.filter(p => p.vivo);

  // Distribución por intervalos de 5 años
  const intervalos = [
    [0, 5],
    [5, 10],
    [10, 15],
    [15, 20],
    [20, 25],
    [25, 30],
    [30, 35],
    [35, 40]
  ];

  let frecuencias = intervalos.map(([min, max]) =>
    vivos.filter(p =>
      p.edad >= min && p.edad < max
    ).length
  );

  let maximo = Math.max(1, ...frecuencias);

  let espacio = areaAncho / intervalos.length;
  let anchoBarra = espacio * 0.7;

  ctx.font = "10px Arial";
  ctx.textAlign = "center";

  frecuencias.forEach((cantidad, i) => {

    let alturaBarra = cantidad / maximo * areaAlto;

    let x = margen + i * espacio +
      (espacio - anchoBarra) / 2;

    let y = alto - margen - alturaBarra;

    ctx.fillStyle = "#8b5cf6";
    ctx.fillRect(x, y, anchoBarra, alturaBarra);

    ctx.fillStyle = "#555";

    if (cantidad > 0) {
      ctx.fillText(
        cantidad,
        x + anchoBarra / 2,
        y - 5
      );
    }

    ctx.fillText(
      intervalos[i][0] + "-" + intervalos[i][1],
      x + anchoBarra / 2,
      alto - margen + 15
    );
  });
}

function actualizarEstadisticas() {

  let vivos = personas.filter(p => p.vivo);

  let generacionMaxima = vivos.length
    ? Math.max(...vivos.map(p => p.generacion))
    : 0;

  let edadMedia = vivos.length
    ? vivos.reduce((s, p) => s + p.edad, 0) / vivos.length
    : 0;

  let descendenciaMedia = vivos.length
    ? vivos.reduce((s, p) => s + p.descendientes, 0) / vivos.length
    : 0;

  let energiaMedia = vivos.length
    ? vivos.reduce((s, p) => s + (Number.isFinite(Number(p.energia)) ? Number(p.energia) : 0), 0) / vivos.length
    : 0;

  estadisticas.textContent =
    "Vivos: " + vivos.length +
    " | Nacimientos: " + nacimientos +
    " | Muertes: " + muertes +
    " | Generación máxima: " + generacionMaxima +
    " | Edad media: " + edadMedia.toFixed(1) +
    " | Descendencia media: " + descendenciaMedia.toFixed(2) +
    " | Energía media: " + (energiaMedia * 100).toFixed(1) + "%" +
    " | Comida: " + comidas.length +
    " | Workers: " + trabajadores.length;
}

// Los Workers reciben instantáneas de solo lectura del mundo.
// Solo el hilo principal modifica comidas, nacimientos y cadáveres.
const WORKER_CODIGO = `
self.onmessage = ({data}) => {
  const {lote, vecinos, comidas, config, hora, madrigueras} = data;
  const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
  const noche=hora>=config.horaNoche || hora<config.horaAmanecer;
  // El deseo de regresar aumenta gradualmente desde las 17 hasta las 21.
  const pesoCasa=hora>=config.inicioAtardecer && hora<config.horaNoche
    ? clamp((hora-config.inicioAtardecer)/(config.horaNoche-config.inicioAtardecer),0,1)
    : noche?1:0;
  const deltaAng=(a,b)=>Math.atan2(Math.sin(b-a),Math.cos(b-a));
  const resultados=[];
  for(const p of lote){
    const edad=p.edad+1/config.fotogramasPorAno;
    if(edad>=p.edadMuerte){resultados.push({id:p.id,edad,muerto:true});continue;}
    const refugio=madrigueras[p.madrigueraId]||madrigueras[0];
    const distCasa=Math.hypot(refugio.x-p.posx,refugio.y-p.posy);
    const durmiendo=noche && distCasa<=config.radioDormir;
    let rumbo=p.angulo;
    const sensores=[];
    for(const sensor of p.sensores){
      let colision=false,comida=false;
      const a=p.angulo+sensor.angulo,dx=Math.cos(a),dy=Math.sin(a);
      for(let d=5;d<=sensor.longitud;d+=3){
        const x=p.posx+dx*d,y=p.posy+dy*d;
        if(x<0||x>config.anchura||y<0||y>config.altura){colision=true;break;}
        for(const otro of vecinos){
          if(otro.id===p.id)continue;
          // Intersección con el núcleo rectangular del otro individuo.
          if(Math.abs(x-otro.posx)<=otro.radio && Math.abs(y-otro.posy)<=otro.radio){colision=true;break;}
        }
        if(colision)break;
        for(const f of comidas){if((x-f.x)**2+(y-f.y)**2<(f.radio+2)**2){comida=true;break;}}
        if(comida)break;
      }
      sensores.push({colision,comida});
      if(colision)rumbo+=sensor.giroColision;
      if(comida)rumbo+=sensor.giroComida*(1-pesoCasa);
    }
    let parejaId=null;
    if(!noche && !p.reproducido && edad>=p.edadReproduccion && pesoCasa<0.85){
      let mejor=Infinity;
      for(const otro of vecinos){
        if(otro.id===p.id || !otro.vivo || otro.sexo===p.sexo || otro.reproducido || otro.edad<otro.edadReproduccion)continue;
        const d=Math.hypot(otro.posx-p.posx,otro.posy-p.posy);
        if(d<mejor){mejor=d;parejaId=otro.id;}
      }
      if(parejaId!==null){
        const pareja=vecinos.find(v=>v.id===parejaId);
        const a=Math.atan2(pareja.posy-p.posy,pareja.posx-p.posx);
        rumbo+=deltaAng(rumbo,a)*config.pesoBuscarPareja*(1-pesoCasa);
      }
    }
    // Combinación angular gradual; nunca se teletransporta la orientación.
    const casaAng=Math.atan2(refugio.y-p.posy,refugio.x-p.posx);
    rumbo+=deltaAng(rumbo,casaAng)*pesoCasa;
    const angulo=p.angulo+clamp(deltaAng(p.angulo,rumbo),-config.giroMaximoPorFotograma,config.giroMaximoPorFotograma);
    const velocidad=durmiendo?0:p.velocidad*(1-pesoCasa)+config.velocidadRegreso*pesoCasa;
    const posx=clamp(p.posx+Math.cos(angulo)*velocidad,p.radio,config.anchura-p.radio);
    const posy=clamp(p.posy+Math.sin(angulo)*velocidad,p.radio,config.altura-p.radio);
    const hambre=clamp(p.hambre+(durmiendo?config.aumentoHambreDormidoPorFotograma:config.aumentoHambrePorFotograma),0,1);
    const energia=clamp(p.energia+(durmiendo?config.recuperacionEnergiaDormidoPorFotograma:-config.perdidaEnergiaPorFotograma-hambre*config.consumoEnergiaPorHambre),0,1);
    if(energia<=0||hambre>=1){resultados.push({id:p.id,edad,posx,posy,angulo,hambre,energia,sensores,durmiendo,muerto:true});continue;}
    const candidatos=[];
    if(!durmiendo)for(let i=0;i<comidas.length;i++){
      const f=comidas[i];if((posx-f.x)**2+(posy-f.y)**2<(p.radio+f.radio)**2)candidatos.push(i);
    }
    resultados.push({id:p.id,edad,posx,posy,angulo,hambre,energia,sensores,candidatos,durmiendo,parejaId,muerto:false});
  }
  self.postMessage(resultados);
}`;

const urlWorker = URL.createObjectURL(new Blob([WORKER_CODIGO], {type:'text/javascript'}));
const trabajadores = Array.from({length: CONFIG.numeroWorkers}, () => new Worker(urlWorker));
URL.revokeObjectURL(urlWorker);
let calculando = false;
let ultimoTiempo = 0;

function ejecutarWorker(worker, datos) {
  return new Promise((resolve,reject) => {
    worker.onmessage = e => resolve(e.data);
    worker.onerror = e => reject(e.message || 'Error del Worker');
    worker.postMessage(datos);
  });
}

async function simularFotograma() {
  fotogramas++;
  if(fotogramas%30===0 && comidas.length<CONFIG.maxComidas) comidas.push(crearComida());

  const vivos = personas.filter(p=>p.vivo);
  const vecinos = vivos.map(p=>({id:p.id,posx:p.posx,posy:p.posy,radio:p.radio,vivo:p.vivo,sexo:p.sexo,edad:p.edad,edadReproduccion:p.edadReproduccion,reproducido:p.reproducido}));
  const alimentos = comidas.map(f=>({x:f.x,y:f.y,radio:f.radio}));
  const tamano = Math.max(1,Math.ceil(vivos.length/trabajadores.length));
  const trabajos = [];
  for(let i=0;i<vivos.length;i+=tamano){
    const lote = vivos.slice(i,i+tamano).map(p=>({
      id:p.id,posx:p.posx,posy:p.posy,radio:p.radio,angulo:p.angulo,
      velocidad:p.velocidad,edad:p.edad,edadMuerte:p.edadMuerte,
      hambre:p.hambre,energia:p.energia,sensores:p.sensores, madrigueraId:p.madrigueraId,sexo:p.sexo,reproducido:p.reproducido
    }));
    trabajos.push(ejecutarWorker(trabajadores[trabajos.length],{
      lote,vecinos,comidas:alimentos,config:CONFIG,hora:horaSimulada(),madrigueras:MADRIGUERAS
    }));
  }
  const resultados = (await Promise.all(trabajos)).flat();
  const porId = new Map(personas.map(p=>[p.id,p]));
  const consumidas = new Set();
  const nuevosHijos=[];


  for(const r of resultados){
    const p=porId.get(r.id);
    if(!p||!p.vivo)continue;
    p.edad=r.edad;
    p.durmiendo=!!r.durmiendo;
    if(r.posx!==undefined){
      p.posx=r.posx;p.posy=r.posy;p.angulo=r.angulo;
      p.hambre=Number.isFinite(Number(r.hambre)) ? limitar(Number(r.hambre),0,1) : limitar(Number(p.hambre)||0,0,1);
      p.energia=Number.isFinite(Number(r.energia)) ? limitar(Number(r.energia),0,1) : limitar(Number(p.energia)||0,0,1);
      if (!Array.isArray(p.sensores)) p.sensores = [];
      r.sensores.forEach((estado,i)=>{
        if (!p.sensores[i]) {
          const gen = p.genoma?.sensores?.[i] || {};
          p.sensores[i] = {
            angulo: Number(gen.angulo) || 0,
            longitud: Number(gen.longitud) || 30,
            giroColision: Number(gen.giroColision) || 0,
            giroComida: Number(gen.giroComida) || 0
          };
        }
        p.sensores[i].colision=!!estado.colision;
        p.sensores[i].comida=!!estado.comida;
      });
    }
    if(r.muerto){p.morir();continue;}

    for(const indice of r.candidatos){
      if(consumidas.has(indice))continue;
      consumidas.add(indice);
      p.hambre=limitar(p.hambre-CONFIG.reduccionHambrePorComida,0,1);
    }
  }
  // Resolver colisiones AABB de núcleos 10x10 en el hilo principal,
  // tras combinar los resultados de todos los Workers.
  const activos=personas.filter(p=>p.vivo);
  for(let pasada=0;pasada<3;pasada++){
    for(let i=0;i<activos.length;i++)for(let j=i+1;j<activos.length;j++){
      const a=activos[i],b=activos[j];
      const dx=b.posx-a.posx,dy=b.posy-a.posy;
      const solX=a.radio+b.radio+CONFIG.margenColision-Math.abs(dx);
      const solY=a.radio+b.radio+CONFIG.margenColision-Math.abs(dy);
      if(solX<=0||solY<=0)continue;
      const signo=(v)=>v<0?-1:1;
      if(solX<solY){const mov=solX/2; a.posx=limitar(a.posx-signo(dx)*mov,a.radio,CONFIG.anchura-a.radio);b.posx=limitar(b.posx+signo(dx)*mov,b.radio,CONFIG.anchura-b.radio);}
      else {const mov=solY/2;a.posy=limitar(a.posy-signo(dy)*mov,a.radio,CONFIG.altura-a.radio);b.posy=limitar(b.posy+signo(dy)*mov,b.radio,CONFIG.altura-b.radio);}
    }
  }
  // Encuentro sexual: pareja disponible, sexos opuestos, proximidad y horario diurno.
  if(!esNoche(horaSimulada())){
    const emparejados=new Set();
    for(const p of activos){
      if(p.reproducido||p.durmiendo||p.edad<p.edadReproduccion||emparejados.has(p.id))continue;
      const candidatos=activos.filter(q=>q.id!==p.id && q.sexo!==p.sexo && !q.reproducido && !q.durmiendo && q.edad>=q.edadReproduccion && !emparejados.has(q.id) && Math.hypot(q.posx-p.posx,q.posy-p.posy)<=CONFIG.distanciaPareja);
      candidatos.sort((a,b)=>Math.hypot(a.posx-p.posx,a.posy-p.posy)-Math.hypot(b.posx-p.posx,b.posy-p.posy));
      const pareja=candidatos[0];
      if(!pareja)continue;
      emparejados.add(p.id);emparejados.add(pareja.id);
      const hijos=p.reproducir(pareja);
      for(const hijo of hijos){if(personas.length+nuevosHijos.length>=CONFIG.maxPoblacion)break;nuevosHijos.push(hijo);nacimientos++;}
    }
  }
  comidas=comidas.filter((_,i)=>!consumidas.has(i));
  personas.push(...nuevosHijos);
  const ahora=performance.now();
  personas=personas.filter(p=>p.vivo||ahora-p.momentoMuerte<CONFIG.tiempoCadaver);
  if(fotogramas%CONFIG.intervaloHistorial===0){
    historialPoblacion.push({tiempo:fotogramas/CONFIG.fotogramasPorAno,
      poblacion:personas.filter(p=>p.vivo).length});
    if(historialPoblacion.length>CONFIG.maxPuntosHistorial)historialPoblacion.shift();
  }
}

function dibujarEscena(){
  contexto.clearRect(0,0,CONFIG.anchura,CONFIG.altura);
  for(const comida of comidas)comida.dibuja(contexto);
  for(const m of MADRIGUERAS){
    contexto.fillStyle='#765238'; contexto.beginPath();contexto.arc(m.x,m.y,14,0,DOS_PI);contexto.fill();
    contexto.fillStyle='#21160f';contexto.beginPath();contexto.arc(m.x,m.y,9,0,DOS_PI);contexto.fill();
    contexto.fillStyle='#fff';contexto.font='9px Arial';contexto.textAlign='center';contexto.fillText(m.id+1,m.x,m.y-17);
  }
  for(const persona of personas)persona.dibuja(contexto);
  // Filtro de luz continuo: noche negra, amanecer/atardecer amarillos y día blanco.
  // Interpolación cíclica sin saltos al cruzar medianoche.
  const luz = [
    {h:0, rgb:[0,0,0], a:0.38},
    {h:5, rgb:[0,0,0], a:0.38},
    {h:7, rgb:[255,200,60], a:0.25},
    {h:9, rgb:[255,255,255], a:0},
    {h:17, rgb:[255,255,255], a:0},
    {h:19, rgb:[255,195,50], a:0.27},
    {h:21, rgb:[0,0,0], a:0.38},
    {h:24, rgb:[0,0,0], a:0.38}
  ];
  const hora = horaSimulada();
  const indice = luz.findIndex((p,i)=>i<luz.length-1 && hora>=p.h && hora<luz[i+1].h);
  const desde = luz[Math.max(0,indice)], hasta = luz[Math.max(1,indice+1)];
  const t = (hora-desde.h)/(hasta.h-desde.h);
  const suavizado = t*t*(3-2*t);
  const mezclar=(a,b)=>a+(b-a)*suavizado;
  const rgb=desde.rgb.map((c,i)=>Math.round(mezclar(c,hasta.rgb[i])));
  const alpha=mezclar(desde.a,hasta.a);
  if(alpha>0){
    contexto.fillStyle=`rgba(${rgb.join(',')},${alpha})`;
    contexto.fillRect(0,0,CONFIG.anchura,CONFIG.altura);
  }
  actualizarReloj();
  if(fotogramas%CONFIG.intervaloGraficas===0){
    actualizarEstadisticas();
    dibujarGraficaPoblacion();
    dibujarGraficaEdades();
  }
}

// Se espera a todos los Workers antes de comenzar el siguiente fotograma.
// Así no hay actualizaciones concurrentes ni carreras sobre el estado compartido.
async function animar(){
  if(calculando)return;
  calculando=true;
  try {await simularFotograma();dibujarEscena();}
  catch(error){console.error('Error en la simulación:',error);}
  finally{calculando=false;requestAnimationFrame(animar);}
}

// Recuperar la última partida antes de iniciar la simulación.
async function iniciarSimulacion() {
  try {
    const respuesta = await fetch('cargar.php', {cache:'no-store'});
    if (!respuesta.ok) throw new Error(`HTTP ${respuesta.status}`);
    const resultado = await respuesta.json();
    if (!resultado.ok) throw new Error(resultado.error || 'Respuesta no válida');
    if (resultado.existe) {
      const d = resultado.datos;
      if (!Array.isArray(d.personas)) throw new Error('Personas no válidas en la partida');
      if (d.config && typeof d.config === 'object') {
        // Mantener los workers creados; el número de workers no cambia durante la sesión.
        const workersActuales = CONFIG.numeroWorkers;
        // SQLite guarda los valores simples como TEXT: restaurar tipos originales.
        for (const [clave, valorActual] of Object.entries(CONFIG)) {
          if (!Object.prototype.hasOwnProperty.call(d.config, clave)) continue;
          const valor = d.config[clave];
          if (typeof valorActual === 'number') {
            const convertido = Number(valor);
            if (valor !== null && valor !== '' && Number.isFinite(convertido)) CONFIG[clave] = convertido;
          } else if (typeof valorActual === 'boolean') {
            CONFIG[clave] = valor === true || valor === 1 || valor === '1' || valor === 'true';
          } else if (typeof valorActual === 'string' && valor != null) {
            CONFIG[clave] = String(valor);
          }
        }
        CONFIG.numeroWorkers = workersActuales;
        // Priorizar las nuevas reglas sobre configuraciones antiguas guardadas.
        CONFIG.fotogramasPorDia = 2160;
        CONFIG.recuperacionEnergiaDormidoPorFotograma = 0.00006;
      }
      const numero = (valor, defecto) => (valor !== null && valor !== undefined && valor !== '' && Number.isFinite(Number(valor))) ? Number(valor) : defecto;
      const booleano = valor => valor === true || valor === 1 || valor === '1' || valor === 'true';
      const sensoresValidos = lista => (Array.isArray(lista) ? lista : []).filter(s => s && typeof s === 'object').map(s => ({
        angulo: numero(s.angulo, 0), longitud: Math.max(1, numero(s.longitud, 40)),
        giroColision: numero(s.giroColision, 0), giroComida: numero(s.giroComida, 0),
        colision: booleano(s.colision), comida: booleano(s.comida)
      }));
      personas = d.personas.map((origen, indice) => {
        // Restaurar el prototipo y métodos de Persona sin llamar al constructor.
        const p = Object.assign(Object.create(Persona.prototype), origen);
        // El id de SQLite es una clave técnica, no el identificador de la persona.
        p.id = numero(origen.personaId, numero(origen.id, indice + 1));
        p.posx = numero(origen.posx, CONFIG.anchura / 2);
        p.posy = numero(origen.posy, CONFIG.altura / 2);
        p.angulo = numero(origen.angulo, 0);
        p.radio = Math.max(1, numero(origen.radio, 5));
        p.hambre = limitar(numero(origen.hambre, 0), 0, 1);
        p.energia = limitar(numero(origen.energia, 0.8), 0, 1);
        p.edad = Math.max(0, numero(origen.edad, 0));
        p.edadReproduccion = numero(origen.edadReproduccion, 20);
        p.edadMuerte = numero(origen.edadMuerte, 30);
        p.generacion = numero(origen.generacion, 0);
        p.vivo = booleano(origen.vivo);
        p.reproducido = booleano(origen.reproducido);
        p.sexo = origen.sexo === 'chico' || origen.sexo === 'chica' ? origen.sexo : (Math.random()<0.5?'chico':'chica');
        p.parejaId = origen.parejaId == null || origen.parejaId === '' ? null : numero(origen.parejaId,null);
        p.sensores = sensoresValidos(origen.sensores);
        const g = origen.genoma && typeof origen.genoma === 'object' && !Array.isArray(origen.genoma) ? origen.genoma : {};
        p.genoma = {
          velocidad: Math.max(0.01, numero(g.velocidad, numero(origen.velocidad, 1))),
          descendientes: Math.max(0, Math.round(numero(g.descendientes, numero(origen.descendientes, 1)))),
          sensores: sensoresValidos(g.sensores)
        };
        if (!p.genoma.sensores.length && p.sensores.length) p.genoma.sensores = sensoresValidos(p.sensores);
        if (!p.sensores.length && p.genoma.sensores.length) p.sensores = sensoresValidos(p.genoma.sensores);
        if (!p.sensores.length) {
          p.sensores = [crearSensorAleatorio(), crearSensorAleatorio()].map(s => ({...s, colision:false, comida:false}));
          p.genoma.sensores = sensoresValidos(p.sensores);
        }
        p.velocidad = Math.max(0.01, numero(origen.velocidad, p.genoma.velocidad));
        p.descendientes = Math.max(0, Math.round(numero(origen.descendientes, p.genoma.descendientes)));
        p.genoma.velocidad = p.velocidad;
        p.genoma.descendientes = p.descendientes;
        p.madrigueraId = Number.isInteger(Number(origen.madrigueraId)) && origen.madrigueraId!==null && origen.madrigueraId!=='' ? ((Number(origen.madrigueraId)%10)+10)%10 : p.id%10;
        p.durmiendo = booleano(origen.durmiendo);
        p.nombre = origen.nombre || 'Persona ' + p.id;
        // performance.now() se reinicia al recargar la página.
        if (!p.vivo) p.momentoMuerte = performance.now();
        return p;
      });
      comidas = (Array.isArray(d.comidas) ? d.comidas : []).map(c => Object.assign(new Comida(numero(c.x, 20),numero(c.y, 20)),{radio:numero(c.radio,4)}));
      historialPoblacion = (Array.isArray(d.historialPoblacion) ? d.historialPoblacion : []).map(h => ({tiempo:numero(h.tiempo,0),poblacion:numero(h.poblacion,0)}));
      fotogramas = Number(d.fotogramas) || 0;
      siguienteId = Math.max(numero(d.siguienteId,1), ...personas.map(p=>p.id+1), 1);
      nacimientos = Number(d.nacimientos) || 0;
      muertes = Number(d.muertes) || 0;
      // Evitar identificadores duplicados de partidas antiguas.
      const ids = new Set();
      for (const p of personas) {
        if (ids.has(p.id)) p.id = siguienteId++;
        ids.add(p.id);
      }
      estadoGuardado.textContent = `Partida recuperada: ${personas.length} individuos, ${comidas.length} alimentos.`;
    }
  } catch (error) {
    console.error('No se pudo cargar la partida:',error);
    estadoGuardado.textContent = 'No se pudo cargar la partida; se inició una simulación nueva.';
  }
  actualizarEstadisticas();
  dibujarGraficaPoblacion();
  dibujarGraficaEdades();
  actualizarReloj();
  requestAnimationFrame(animar);
}
iniciarSimulacion();
